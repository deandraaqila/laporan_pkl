    const INITIAL_REPORTS = [

        title: 'Pengembangan Rest API Endpoint Authentication',
        description: 'Melakukan penulisan kode untuk endpoint JWT Authentication dan validasi kredensial pengguna.',
        result: 'Endpoint /api/v1/auth/login selesai dan lulus pengujian unit test.',
        obstacles: 'Koneksi jaringan sempat mengalami downtime saat mengunduh package NPM.',
        solution: 'Menggunakan mirror registry lokal.',

        checkIn: '08:05',
        checkOut: '17:00',
        attendance: 'Hadir',
        title: 'Slicing UI Responsive Dashboard & Canvas Editor',
        description: 'Membuat tampilan antarmuka profil interaktif dengan fitur penyesuaian rotasi dan zoom foto.',
        result: 'Komponen UI telah terintegrasi dengan state React.',
        obstacles: 'Penyesuaian ukuran canvas di layar smartphone.',
        solution: 'Menggunakan responsive bounding box listener.',
        status: 'Menunggu Review',
        note: '',
        submitted_at: '2026-10-06 17:05:00',
        reviewed_at: null,
        deleted_at: null
      }
    ];

    const INITIAL_PHOTOS = [
      {
        photo_id: 'pho-1',
        report_id: 'rep-101',
        file_url: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop&q=80',
        file_name: 'kegiatan_coding.jpg',
        uploaded_at: '2026-10-05 17:15:00',
        deleted_at: null
      },
      {
        photo_id: 'pho-2',
        report_id: 'rep-102',
        file_url: 'https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=600&auto=format&fit=crop&q=80',
        file_name: 'slicing_ui.jpg',
        uploaded_at: '2026-10-06 17:05:00',
        deleted_at: null
      }
    ];

    // --- STORAGE HELPERS ---
    const Storage = {
      load: (key, fallback) => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
          console.error('Storage load error:', e);
          return fallback;
        }
      },
      save: (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          console.error('Storage save error:', e);
          return false;
        }
      },
      remove: (key) => {
        try { localStorage.removeItem(key); } catch (e) {}
      }
    };

    // --- IMAGE COMPRESSOR (biar localStorage ga cepet penuh) ---
    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let { width, height } = img;
            const maxDim = CONFIG.PHOTO_MAX_DIMENSION;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = (height / width) * maxDim;
                width = maxDim;
              } else {
                width = (width / height) * maxDim;
                height = maxDim;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', CONFIG.PHOTO_QUALITY));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    // --- COMPONENT: FEATHER ICON REUSABLE ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.feather) {
          ref.current.innerHTML = window.feather.icons[name] 
            ? window.feather.icons[name].toSvg({ width: size, height: size, class: className }) 
            : '';
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    };

    // --- COMPONENT: USER AVATAR ---
    const UserAvatar = ({ src, name = "User", size = "md", className = "" }) => {
      const sizeClasses = {
        sm: "w-8 h-8 text-xs",
        md: "w-10 h-10 text-sm",
        lg: "w-16 h-16 text-xl",
        profile: "w-28 h-28 sm:w-32 sm:h-32 text-3xl"
      };

      const getInitials = (str) => {
        if (!str) return "U";
        return str.split(" ").map(n => n[0]).join("").toUpperCase().substring(0, 2);
      };

      if (src) {
        return (
          <img 
            src={src} 
            alt={name} 
            className={`${sizeClasses[size]} rounded-2xl object-cover border-2 border-indigo-500/20 shadow-sm ${className}`} 
          />
        );
      }

      return (
        <div className={`${sizeClasses[size]} rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white font-bold flex items-center justify-center shadow-md ${className}`}>
          {getInitials(name)}
        </div>
      );
    };

    // --- COMPONENT: STATUS BADGE ---
    const StatusBadge = ({ status }) => {
      const badges = {
        'Hadir': 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800',
        'Izin': 'bg-amber-50 text-amber-600 dark:bg-amber-950/60 dark:text-amber-400 border-amber-200 dark:border-amber-800',
        'Sakit': 'bg-rose-50 text-rose-600 dark:bg-rose-950/60 dark:text-rose-400 border-rose-200 dark:border-rose-800',
        'Disetujui': 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800',
        'Menunggu Review': 'bg-sky-50 text-sky-600 dark:bg-sky-950/60 dark:text-sky-400 border-sky-200 dark:border-sky-800',
        'Ditolak': 'bg-rose-50 text-rose-600 dark:bg-rose-950/60 dark:text-rose-400 border-rose-200 dark:border-rose-800',
        'Draft': 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border-slate-200 dark:border-slate-700'
      };

      return (
        <span className={`px-2.5 py-1 text-[11px] font-bold rounded-lg border ${badges[status] || 'bg-slate-100 text-slate-600'}`}>
          {status}
        </span>
      );
    };

    // --- COMPONENT: MODAL WRAPPER ---
    const Modal = ({ title, onClose, children, maxWidth = "max-w-xl" }) => {
      useEffect(() => {
        const handleKeyDown = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div className={`bg-white dark:bg-slate-800 w-full ${maxWidth} rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[90vh] flex flex-col overflow-hidden`}>
            <div className="px-6 py-4 border-b dark:border-slate-700 flex justify-between items-center shrink-0">
              <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">{title}</h3>
              <button onClick={onClose} className="p-1 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                <Icon name="x" size={20} />
              </button>
            </div>
            <div className="p-6 overflow-y-auto flex-1 scrollbar-none">
              {children}
            </div>
          </div>
        </div>
      );
    };

    // --- COMPONENT: CONFIRMATION MODAL ---
    const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel, confirmText = "Ya, Hapus", isDanger = true }) => {
      if (!isOpen) return null;
      return (
        <Modal title={title} onClose={onCancel} maxWidth="max-w-md">
          <div className="space-y-4">
            <p className="text-sm text-slate-600 dark:text-slate-300">{message}</p>
            <div className="flex justify-end gap-3 pt-2">
              <button 
                onClick={onCancel}
                className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 hover:bg-slate-200 transition"
              >
                Batal
              </button>
              <button 
                onClick={onConfirm}
                className={`px-4 py-2 rounded-xl text-xs font-bold text-white shadow-md transition ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700'}`}
              >
                {confirmText}
              </button>
            </div>
          </div>
        </Modal>
      );
    };

    // --- COMPONENT: LIGHTBOX / FULLSCREEN PHOTO VIEWER ---
    const LightboxModal = ({ photo, onClose }) => {
      if (!photo) return null;
      return (
        <div className="fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4 animate-fadeIn" onClick={onClose}>
          <button onClick={onClose} className="absolute top-4 right-4 text-white bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
            <Icon name="x" size={24} />
          </button>
          <img src={photo.file_url} alt={photo.file_name} className="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl" />
          <p className="text-white/80 text-xs mt-3 font-medium">{photo.file_name}</p>
        </div>
      );
    };

    // --- COMPONENT: CANVAS PHOTO EDITOR MODAL ---
    const ProfilePictureEditorModal = ({ imageSrc, onClose, onSave }) => {
      const canvasRef = useRef(null);
      const [zoom, setZoom] = useState(1);
      const [rotation, setRotation] = useState(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || !imageSrc) return;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = imageSrc;
        img.onload = () => {
          const size = 300;
          canvas.width = size;
          canvas.height = size;

          ctx.clearRect(0, 0, size, size);
          ctx.save();
          ctx.translate(size / 2, size / 2);
          ctx.rotate((rotation * Math.PI) / 180);
          ctx.scale(zoom, zoom);
          ctx.drawImage(img, -size / 2, -size / 2, size, size);
          ctx.restore();
        };
      }, [imageSrc, zoom, rotation]);

      const handleSave = () => {
        const canvas = canvasRef.current;
        if (canvas) {
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          onSave(dataUrl);
        }
      };

      return (
        <Modal title="Edit Foto Profil" onClose={onClose} maxWidth="max-w-md">
          <div className="space-y-5 text-xs">
            <div className="flex flex-col items-center justify-center bg-slate-100 dark:bg-slate-900 p-4 rounded-2xl border dark:border-slate-700">
              <canvas ref={canvasRef} className="w-60 h-60 rounded-full border-4 border-indigo-500 shadow-lg object-cover" />
            </div>

            <div className="space-y-3">
              <div>
                <div className="flex justify-between font-bold mb-1">
                  <span>Zoom</span>
                  <span>{Math.round(zoom * 100)}%</span>
                </div>
                <input 
                  type="range" 
                  min="0.5" 
                  max="2.5" 
                  step="0.1" 
                  value={zoom} 
                  onChange={(e) => setZoom(parseFloat(e.target.value))}
                  className="w-full accent-indigo-600"
                />
              </div>

              <div className="flex items-center justify-between gap-2">
                <span className="font-bold">Rotasi</span>
                <div className="flex gap-2">
                  <button onClick={() => setRotation((r) => (r + 90) % 360)} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold flex items-center gap-1">
                    <Icon name="rotate-cw" size={14} /> +90°
                  </button>
                  <button onClick={() => { setZoom(1); setRotation(0); }} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold flex items-center gap-1">
                    <Icon name="refresh-cw" size={14} /> Reset
                  </button>
                </div>
              </div>
            </div>

            <div className="flex gap-3 pt-2">
              <button onClick={onClose} className="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 font-bold rounded-xl text-slate-600 dark:text-slate-200">
                Batal
              </button>
              <button onClick={handleSave} className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md">
                Simpan Foto
              </button>
            </div>
          </div>
        </Modal>
      );
    };

    // --- COMPONENT: LOGIN VIEW ---
    const LoginView = ({ portalType, onLogin, onSwitchPortal }) => {
      const [username, setUsername] = useState(portalType === 'student' ? 'deandra' : 'udin');
      const [password, setPassword] = useState(portalType === 'student' ? 'Deandra@PKL2026' : 'Udin@PKL2026');
      const [error, setError] = useState('');

      useEffect(() => {
        setUsername(portalType === 'student' ? 'deandra' : 'udin');
        setPassword(portalType === 'student' ? 'Deandra@PKL2026' : 'Udin@PKL2026');
        setError('');
      }, [portalType]);

      const handleSubmit = (e) => {
        e.preventDefault();
        const success = onLogin(username, password, portalType);
        if (!success) {
          setError('Username atau Password salah! Periksa kembali data login Anda.');
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-500 via-indigo-600 to-slate-900">
          <div className="bg-white dark:bg-slate-800 w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6 border border-white/20">
            <div className="text-center space-y-2">
              <div className="w-14 h-14 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg font-black text-xl">
                PKL
              </div>
              <h2 className="text-xl font-extrabold text-slate-800 dark:text-white">
                {portalType === 'student' ? 'Portal Siswa PKL' : 'Portal Pembimbing Lapangan'}
              </h2>
              <p className="text-xs text-slate-400">Silakan masuk menggunakan akun resmi Anda</p>
            </div>

            {error && (
              <div className="p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-xl font-semibold">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Username</label>
                <input 
                  type="text" 
                  value={username} 
                  onChange={(e) => setUsername(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none font-medium"
                  required
                />
              </div>

              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Password</label>
                <input 
                  type="password" 
                  value={password} 
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none font-medium"
                  required
                />
              </div>

              <button 
                type="submit" 
                className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition duration-200"
              >
                Masuk Sekarang
              </button>
            </form>

            <div className="pt-4 border-t dark:border-slate-700 text-center">
              <button 
                onClick={onSwitchPortal} 
                className="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline inline-flex items-center gap-1"
              >
                <Icon name="repeat" size={14} /> Switch ke Login {portalType === 'student' ? 'Pembimbing' : 'Siswa'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- COMPONENT: BACKUP & RESTORE VIEW ---
    const BackupRestoreView = ({ onExportJSON, onImportJSON, onResetData, storageInfo }) => {
      const fileInputRef = useRef(null);

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            onImportJSON(data);
          } catch (err) {
            alert('File JSON tidak valid atau terdistorsi!');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          {storageInfo && (
            <div className="bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900 rounded-3xl p-5 flex items-start gap-3">
              <div className="p-2 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded-xl shrink-0">
                <Icon name="info" size={18} />
              </div>
              <div className="text-xs space-y-1">
                <p className="font-bold text-indigo-800 dark:text-indigo-300">Status Penyimpanan Browser</p>
                <p className="text-indigo-700 dark:text-indigo-400">
                  Terpakai: <strong>{storageInfo.usedKB} KB</strong> dari total kapasitas browser (~5.000 KB). 
                  {storageInfo.usedKB > 4000 && <span className="text-rose-600 font-bold"> ⚠️ Hampir penuh, segera backup!</span>}
                </p>
              </div>
            </div>
          )}

          <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
            <div className="flex items-center gap-3">
              <div className="p-3 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 rounded-2xl">
                <Icon name="database" size={24} />
              </div>
              <div>
                <h3 className="font-bold text-base">Backup & Export Data JSON</h3>
                <p className="text-xs text-slate-400">Unduh seluruh arsip data laporan, foto dokumentasi, dan metadata sistem.</p>
              </div>
            </div>

            <p className="text-xs text-slate-500 leading-relaxed">
              Berkas cadangan JSON menyimpan seluruh histori laporan, status review, serta profil pengguna. 
              Gunakan fitur ini secara berkala untuk amankan data PKL Anda, terutama sebelum mengganti perangkat atau browser.
            </p>

            <div className="pt-2">
              <button 
                onClick={onExportJSON}
                className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-2"
              >
                <Icon name="download" size={16} /> Download Backup JSON
              </button>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
            <div className="flex items-center gap-3">
              <div className="p-3 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 rounded-2xl">
                <Icon name="upload-cloud" size={24} />
              </div>
              <div>
                <h3 className="font-bold text-base">Restore Data dari JSON</h3>
                <p className="text-xs text-slate-400">Kembalikan atau timpa database dari file cadangan .json yang telah diunduh sebelumnya.</p>
              </div>
            </div>

            <p className="text-xs text-slate-500 leading-relaxed">
              Pastikan struktur berkas JSON sesuai standar sistem PKL 2026. Data yang diunggah akan secara otomatis memperbarui state aktif website.
            </p>

            <div className="pt-2">
              <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
              <button 
                onClick={() => fileInputRef.current.click()}
                className="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-2"
              >
                <Icon name="file-plus" size={16} /> Pilih File JSON & Restore
              </button>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-rose-200 dark:border-rose-900/60 shadow-sm space-y-4">
            <div className="flex items-center gap-3">
              <div className="p-3 bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 rounded-2xl">
                <Icon name="alert-triangle" size={24} />
              </div>
              <div>
                <h3 className="font-bold text-base text-rose-700 dark:text-rose-400">Reset Data ke Default</h3>
                <p className="text-xs text-slate-400">Hapus semua data tersimpan di browser dan kembalikan ke data demo awal.</p>
              </div>
            </div>

            <p className="text-xs text-slate-500 leading-relaxed">
              ⚠️ <strong>Aksi ini tidak bisa dibatalkan.</strong> Pastikan Anda sudah melakukan backup JSON terlebih dahulu sebelum reset.
            </p>

            <div className="pt-2">
              <button 
                onClick={onResetData}
                className="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-2"
              >
                <Icon name="trash-2" size={16} /> Reset Semua Data
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- COMPONENT: STUDENT DASHBOARD ---
    const StudentDashboard = ({ user, supervisor, reports, setActiveTab }) => {
      const activeReports = reports.filter(r => !r.deleted_at);
      const total = activeReports.length;
      const approved = activeReports.filter(r => r.status === 'Disetujui').length;
      const pending = activeReports.filter(r => r.status === 'Menunggu Review').length;

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-indigo-600 to-indigo-800 text-white p-6 sm:p-8 rounded-3xl shadow-xl flex flex-col sm:flex-row items-center justify-between gap-6">
            <div className="space-y-2 text-center sm:text-left">
              <span className="px-3 py-1 bg-white/20 rounded-full text-[10px] font-bold uppercase tracking-wider">Selamat Datang Kembali</span>
              <h2 className="text-xl sm:text-2xl font-extrabold">{user.name}</h2>
              <p className="text-xs text-indigo-100">{user.school} • {user.internship}</p>
            </div>
            <button 
              onClick={() => setActiveTab('add-report')} 
              className="px-5 py-3 bg-white text-indigo-600 hover:bg-indigo-50 font-extrabold text-xs rounded-2xl shadow-lg transition flex items-center gap-2 shrink-0"
            >
              <Icon name="plus-circle" size={18} /> Buat Laporan Harian
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-400 font-bold uppercase">Total Laporan</p>
                <p className="text-2xl font-extrabold mt-1">{total}</p>
              </div>
              <div className="p-3 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 rounded-xl">
                <Icon name="file-text" size={20} />
              </div>
            </div>

            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-400 font-bold uppercase">Laporan Disetujui</p>
                <p className="text-2xl font-extrabold text-emerald-600 mt-1">{approved}</p>
              </div>
              <div className="p-3 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 rounded-xl">
                <Icon name="check-circle" size={20} />
              </div>
            </div>

            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-400 font-bold uppercase">Menunggu Review</p>
                <p className="text-2xl font-extrabold text-sky-600 mt-1">{pending}</p>
              </div>
              <div className="p-3 bg-sky-50 dark:bg-sky-950/60 text-sky-600 rounded-xl">
                <Icon name="clock" size={20} />
              </div>
            </div>
          </div>

          {supervisor && (
            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
              <UserAvatar src={supervisor.avatar} name={supervisor.name} size="md" />
              <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">Pembimbing Lapangan Anda</p>
                <h4 className="font-bold text-sm text-slate-800 dark:text-slate-100">{supervisor.name}</h4>
                <p className="text-xs text-slate-500">{supervisor.position} ({supervisor.phone})</p>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- COMPONENT: SUPERVISOR DASHBOARD ---
    const SupervisorDashboard = ({ user, students, reports, setActiveTab, onSelectReport }) => {
      const activeReports = reports.filter(r => !r.deleted_at);
      const pendingReports = activeReports.filter(r => r.status === 'Menunggu Review');

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-slate-800 to-slate-900 text-white p-6 sm:p-8 rounded-3xl shadow-xl flex flex-col sm:flex-row items-center justify-between gap-6">
            <div className="space-y-2 text-center sm:text-left">
              <span className="px-3 py-1 bg-white/10 rounded-full text-[10px] font-bold uppercase tracking-wider">Dashboard Pembimbing</span>
              <h2 className="text-xl sm:text-2xl font-extrabold">Selamat Datang, {user.name}</h2>
              <p className="text-xs text-slate-300">{user.institution} • {user.position}</p>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">Perlu Ditinjau Segera ({pendingReports.length})</h3>
              <button onClick={() => setActiveTab('reports')} className="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline">

              </button>
            </div>

            {pendingReports.length === 0 ? (
              <p className="text-xs text-slate-400 italic">Semua laporan siswa telah selesai ditinjau.</p>
            ) : (
              <div className="space-y-3">
                {pendingReports.slice(0, 3).map(r => (
                  <div key={r.id} className="p-4 bg-slate-50 dark:bg-slate-700/40 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                      <span className="text-[10px] font-bold text-slate-400">{r.date}</span>
                      <h4 className="font-bold text-xs text-slate-800 dark:text-slate-100">{r.title}</h4>
                      <p className="text-xs text-slate-500 line-clamp-1">{r.description}</p>
                    </div>
                    <button 
                      onClick={() => onSelectReport(r)} 
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow transition shrink-0"

                      Tinjau Sekarang
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- COMPONENT: REPORTS LIST & EXPORT TOOLBAR ---
    const ReportsView = ({ 
      reports, 
      photos, 
      isStudent, 
      onSelectReport, 
      onEditReport, 
      onDeleteReport, 
      statusFilter, 
      setStatusFilter,
      onExportExcel,
      onExportPDF
    }) => {
      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto scrollbar-none pb-1 md:pb-0">
              {['Semua', 'Menunggu Review', 'Disetujui', 'Ditolak'].map(st => (
                <button
                  key={st}
                  onClick={() => setStatusFilter(st)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                    statusFilter === st 
                      ? 'bg-indigo-600 text-white shadow-md' 
                      : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                  }`}
                >
                  {st}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2 w-full md:w-auto justify-end">
              <button
