        xl: "w-16 h-16 text-xl rounded-2xl",

        if (!n) return "U";
        const parts = n.trim().split(" ");
        if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
        return parts[0].substring(0, 2).toUpperCase();
      };

        return (
          <div className={`${sizeClasses[size] || sizeClasses.md} bg-indigo-600 text-white font-black flex items-center justify-center shrink-0 border border-indigo-400 shadow-sm ${className}`}>
            {getInitials(name)}
          </div>
        );
      }

        <img 
          src={src} 
          alt={name} 
          onError={() => setImgError(true)}

    // --- INTERACTIVE PROFILE PICTURE EDITOR MODAL (CANVAS CROP / ROTATE / ZOOM) ---
    const ProfilePictureEditorModal = ({ imageSrc, onClose, onSave }) => {
      const [zoom, setZoom] = useState(1);
      const [rotation, setRotation] = useState(0);
      const canvasRef = useRef(null);
      const imgRef = useRef(null);

      useEffect(() => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = imageSrc;
        img.onload = () => {
          imgRef.current = img;
          renderCanvas();
        };
      }, [imageSrc]);

      useEffect(() => {
        if (imgRef.current) {
          renderCanvas();
        }
      }, [zoom, rotation]);

      const renderCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas || !imgRef.current) return;
        const ctx = canvas.getContext('2d');
        const img = imgRef.current;

        const size = 300;
        canvas.width = size;
        canvas.height = size;

        ctx.clearRect(0, 0, size, size);
        ctx.save();

        // Move to center
        ctx.translate(size / 2, size / 2);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.scale(zoom, zoom);

        // Draw image centered
        const aspect = img.width / img.height;
        let drawWidth, drawHeight;
        if (aspect > 1) {
          drawHeight = size;
          drawWidth = size * aspect;
        } else {
          drawWidth = size;
          drawHeight = size / aspect;
        }

        ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();
      };

      const handleReset = () => {
        setZoom(1);
        setRotation(0);
      };

      const handleSave = () => {
        const canvas = canvasRef.current;
        if (canvas) {
          // Export cropped canvas preview to base64
          const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
          onSave(dataUrl);
        }
      };

      return (
        <Modal title="Edit & Potong Foto Profil" onClose={onClose}>
          <div className="space-y-5 text-xs">
            {/* CANVAS PREVIEW AREA */}
            <div className="flex justify-center bg-slate-900 p-4 rounded-2xl relative overflow-hidden">
              <canvas ref={canvasRef} className="rounded-full shadow-2xl border-4 border-indigo-500 max-w-full h-auto cursor-grab" />
            </div>

            {/* CONTROLS */}
            <div className="space-y-4 bg-slate-50 dark:bg-slate-700/40 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
              <div>
                <div className="flex justify-between font-bold mb-1">
                  <span className="text-slate-600 dark:text-slate-300">Zoom ({Math.round(zoom * 100)}%)</span>
                  <div className="flex gap-2 text-indigo-600 dark:text-indigo-400">
                    <button type="button" onClick={() => setZoom(Math.max(0.5, zoom - 0.1))} className="hover:underline font-bold">- Zoom Out</button>
                    <span>•</span>
                    <button type="button" onClick={() => setZoom(Math.min(3, zoom + 0.1))} className="hover:underline font-bold">+ Zoom In</button>
                  </div>
                </div>
                <input 
                  type="range" 
                  min="0.5" 
                  max="3" 
                  step="0.05" 
                  value={zoom} 
                  onChange={(e) => setZoom(parseFloat(e.target.value))}
                  className="w-full accent-indigo-600 cursor-pointer"
                />
              </div>

              <div>
                <div className="flex justify-between font-bold mb-1">
                  <span className="text-slate-600 dark:text-slate-300">Putar / Rotate ({rotation}°)</span>
                  <button type="button" onClick={() => setRotation((rotation + 90) % 360)} className="text-indigo-600 dark:text-indigo-400 hover:underline font-bold">
                    ↻ Rotate +90°
                  </button>
                </div>
                <input 
                  type="range" 
                  min="0" 
                  max="360" 
                  step="5" 
                  value={rotation} 
                  onChange={(e) => setRotation(parseInt(e.target.value))}
                  className="w-full accent-indigo-600 cursor-pointer"
                />
              </div>

              <div className="flex justify-end">
                <button type="button" onClick={handleReset} className="px-3 py-1 bg-slate-200 dark:bg-slate-600 font-bold rounded-lg hover:bg-slate-300 transition">
                  ↺ Reset Tampilan
                </button>
              </div>
            </div>

            {/* ACTION BUTTONS */}

                <button onClick={() => setActiveTab('add-report')} className="px-4 py-2 bg-white text-indigo-600 rounded-xl text-xs font-bold shadow-md hover:bg-indigo-50 transition">

                </button>

            </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

              <div className="p-3 bg-indigo-50 dark:bg-indigo-950 text-indigo-600 rounded-xl"><Icon name="file-text" size={24} /></div>

            <div className="p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">

            </div>
            <div className="p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-[11px] text-slate-400 font-bold uppercase">Menunggu Review</p>
                <h3 className="text-2xl font-black mt-1 text-amber-500">{pendingCount}</h3>
              </div>
              <div className="p-3 bg-amber-50 dark:bg-amber-950 text-amber-500 rounded-xl"><Icon name="clock" size={24} /></div>
            </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 space-y-4">
            <h3 className="font-bold text-sm">Pembimbing Lapangan Anda</h3>
            {supervisor ? (
              <div className="flex items-center gap-4 p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-100 dark:border-slate-700">
                <UserAvatar src={supervisor.avatar} name={supervisor.name} size="lg" />
                <div>
                  <h4 className="font-bold text-xs">{supervisor.name}</h4>
                  <p className="text-[11px] text-slate-400">{supervisor.position} — {supervisor.institution}</p>
                  <p className="text-[11px] text-indigo-600 dark:text-indigo-400 font-semibold mt-0.5">{supervisor.email}</p>
                </div>
              </div>
            ) : <p className="text-xs text-slate-400">Belum ditugaskan pembimbing.</p>}
          </div>
        </div>
      );
    };

    const SupervisorDashboard = ({ user, students, reports, photos, setActiveTab, onSelectReport }) => {
      const pendingReviews = reports.filter(r => r.status === 'Menunggu Review');

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="p-6 bg-slate-900 text-white rounded-3xl shadow-lg flex justify-between items-center">
            <div>
              <h2 className="text-xl font-bold">Selamat Datang, Bpk. {user.name} 👨‍🏫</h2>
              <p className="text-xs text-slate-400 mt-1">Anda membimbing {students.length} siswa PKL aktif saat ini.</p>
            </div>
            <button onClick={() => setActiveTab('reports')} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow hover:bg-indigo-700 transition">
              Review Laporan ({pendingReviews.length})
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="p-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
              <h3 className="font-bold text-xs uppercase text-slate-400">Siswa Bimbingan</h3>
              {students.map(s => (
                <div key={s.id} className="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl">
                  <div className="flex items-center gap-3">
                    <UserAvatar src={s.avatar} name={s.name} size="md" />
                    <div>
                      <h4 className="font-bold text-xs">{s.name}</h4>
                      <p className="text-[11px] text-slate-400">{s.class} — {s.internship}</p>
                    </div>
                  </div>
                  <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md font-bold">{s.status}</span>
                </div>
              ))}
            </div>

            <div className="p-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
              <h3 className="font-bold text-xs uppercase text-slate-400">Perlu Peninjauan Segera</h3>
              {pendingReviews.length === 0 ? (
                <p className="text-xs text-slate-400 py-4 text-center">Semua laporan telah ditinjau!</p>
              ) : (
                pendingReviews.map(r => {
                  const repPhotos = photos.filter(p => p.report_id === r.id && !p.deleted_at);
                  return (
                    <div key={r.id} onClick={() => onSelectReport(r)} className="p-3 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/50 rounded-xl space-y-1.5 cursor-pointer hover:border-amber-400 transition">
                      <div className="flex justify-between text-xs font-bold">
                        <span>{r.title}</span>
                        <span className="text-amber-600">{r.date}</span>
                      </div>
                      <p className="text-[11px] text-slate-500 line-clamp-1">{r.description}</p>
                      
                      {/* BUKTI DOKUMENTASI BADGE */}
                      <div className="flex items-center gap-2 pt-1">
                        <span className="inline-flex items-center gap-1 text-[10px] font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-700">
                          <Icon name="camera" size={12} />
                          📷 Dokumentasi ({repPhotos.length} Foto)
                        </span>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      );
    };

    // --- OTHER VIEWS ---
    const ReportsView = ({ reports, photos, isStudent, onSelectReport, onEditReport, onDeleteReport, statusFilter, setStatusFilter }) => (
      <div className="space-y-4 animate-fadeIn">
        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <h2 className="text-lg font-bold">{isStudent ? 'Laporan Saya' : 'Daftar Laporan Siswa'}</h2>
          <div className="flex gap-2">
            {['Semua', 'Disetujui', 'Menunggu Review'].map(st => (
              <button 
                key={st} 
                onClick={() => setStatusFilter(st)}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${statusFilter === st ? 'bg-indigo-600 text-white' : 'bg-white dark:bg-slate-800 border text-slate-600 dark:text-slate-300'}`}
              >
                {st}
              </button>
            ))}
          </div>
        </div>

        <div className="grid gap-3">
          {reports.length === 0 ? (
            <div className="p-8 text-center bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 text-slate-400 text-xs">
              Tidak ada laporan ditemukan.
            </div>
          ) : (
            reports.map(r => {
              const repPhotos = photos.filter(p => p.report_id === r.id && !p.deleted_at);
              return (
                <div 
                  key={r.id} 
                  className="p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:border-indigo-500 transition flex flex-col md:flex-row justify-between items-start md:items-center gap-4"
                >
                  <div className="space-y-1.5 cursor-pointer flex-1" onClick={() => onSelectReport(r)}>
                    <div className="flex items-center gap-2 flex-wrap">
                      <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">{r.title}</h3>
                      <StatusBadge status={r.status} />
                      <span className="inline-flex items-center gap-1 text-[10px] text-slate-500 bg-slate-100 dark:bg-slate-700/60 px-2 py-0.5 rounded-md font-semibold">
                        <Icon name="camera" size={12} />
                        📷 {repPhotos.length} Foto
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">{r.description}</p>
                    <p className="text-[11px] text-slate-400 font-medium">{r.date} • Check-in: {r.checkIn} - Check-out: {r.checkOut}</p>
                  </div>
                  
                  {/* ACTION BUTTONS */}
                  <div className="flex items-center gap-2 shrink-0">
                    <button 
                      onClick={() => onSelectReport(r)} 
                      className="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-slate-600 transition">
                      Lihat Detail
                    </button>
                    {isStudent && (
                      <>
                        <button 
                          onClick={() => onEditReport(r)} 
                          className="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-300 rounded-xl text-xs font-bold hover:bg-indigo-100 transition">
                          Edit
                        </button>
                        <button 
                          onClick={() => onDeleteReport(r.id)} 
                          className="px-3 py-1.5 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 rounded-xl text-xs font-bold hover:bg-rose-100 transition">
                          Hapus
                        </button>
                      </>
                    )}
                  </div>
                </div>
              );
            })
          )}
        </div>
      </div>
    );

    const AddReportView = ({ reportForm, setReportForm, photoList, setPhotoList, formErrors, uploadError, setUploadError, isEditing, onSubmit, onCancel }) => {
      const fileInputRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);

      // --- PHOTO UPLOAD VALIDATION & HANDLING ---
      const handleFileSelect = (files) => {
        setUploadError('');
        const validFiles = Array.from(files);

        for (let file of validFiles) {
          if (!CONFIG.ALLOWED_FILE_TYPES.includes(file.type)) {
            setUploadError(`Format file ${file.name} tidak didukung! Gunakan format JPG, PNG, atau WEBP.`);
            return;
          }
          if (file.size > CONFIG.MAX_FILE_SIZE_MB * 1024 * 1024) {
            setUploadError(`Ukuran file ${file.name} melebihi ${CONFIG.MAX_FILE_SIZE_MB} MB!`);
            return;
          }
        }

        const newPhotoObjects = validFiles.map((file, idx) => ({
          photo_id: `temp-${Date.now()}-${idx}-${Math.random().toString(36).substring(2, 7)}`,
          file_name: file.name,
          file_url: URL.createObjectURL(file),
          uploaded_at: new Date().toISOString().replace('T', ' ').substring(0, 19),
          isNew: true
        }));

        setPhotoList([...photoList, ...newPhotoObjects]);
      };

      const handleRemovePhoto = (photoId) => {
        if (confirm("Apakah Anda yakin ingin menghapus foto dokumentasi ini?")) {
          setPhotoList(photoList.filter(p => p.photo_id !== photoId));
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFileSelect(e.dataTransfer.files);
        }
      };

      return (
        <div className="max-w-2xl mx-auto bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm animate-fadeIn">
          <div className="flex justify-between items-center mb-4">
            <h2 className="text-lg font-bold">{isEditing ? 'Edit Laporan Harian' : 'Input Laporan Kegiatan Harian'}</h2>
            {isEditing && (
              <button onClick={onCancel} className="text-xs text-slate-400 hover:text-slate-600 font-semibold">
                Batal Edit
              </button>
            )}
          </div>

          <form onSubmit={onSubmit} className="space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Tanggal</label>
                <input 
                  type="date" 
                  value={reportForm.date} 
                  onChange={(e) => setReportForm({ ...reportForm, date: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600" 
                />
                {formErrors.date && <p className="text-[10px] text-red-500 font-semibold mt-1">{formErrors.date}</p>}
              </div>
              <div>
                <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Kehadiran</label>
                <select 
                  value={reportForm.attendance} 
                  onChange={(e) => setReportForm({ ...reportForm, attendance: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600"
                >
                  <option value="Hadir">Hadir</option>
                  <option value="Izin">Izin</option>
                  <option value="Sakit">Sakit</option>
                </select>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Jam Masuk</label>
                <input 
                  type="time" 
                  value={reportForm.checkIn} 
                  onChange={(e) => setReportForm({ ...reportForm, checkIn: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600" 
                />
              </div>
              <div>
                <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Jam Pulang</label>
                <input 
                  type="time" 
                  value={reportForm.checkOut} 
                  onChange={(e) => setReportForm({ ...reportForm, checkOut: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600" 
                />
              </div>
            </div>

            <div>
              <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Judul Kegiatan</label>
              <input 
                type="text" 
                placeholder="Contoh: Maintenance LAN & Konfigurasi Switch"
                value={reportForm.title} 
                onChange={(e) => setReportForm({ ...reportForm, title: e.target.value })}
                className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600" 
              />
              {formErrors.title && <p className="text-[10px] text-red-500 font-semibold mt-1">{formErrors.title}</p>}
            </div>

            <div>
              <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Deskripsi Kegiatan</label>
              <textarea 
                rows={3}
                placeholder="Jelaskan detail pekerjaan yang dilakukan hari ini..."
                value={reportForm.description} 
                onChange={(e) => setReportForm({ ...reportForm, description: e.target.value })}
                className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600" 
              />
              {formErrors.description && <p className="text-[10px] text-red-500 font-semibold mt-1">{formErrors.description}</p>}
            </div>

            <div>
              <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Hasil Pekerjaan</label>
              <textarea 
                rows={2}
                placeholder="Hasil yang dicapai..."
                value={reportForm.result} 
                onChange={(e) => setReportForm({ ...reportForm, result: e.target.value })}
                className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600" 
              />
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Kendala (Bila Ada)</label>
                <input 
                  type="text" 
                  value={reportForm.obstacles} 
                  onChange={(e) => setReportForm({ ...reportForm, obstacles: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600" 
                />
              </div>
              <div>
                <label className="text-xs font-bold text-slate-600 dark:text-slate-300 block mb-1">Solusi</label>
                <input 
                  type="text" 
                  value={reportForm.solution} 
                  onChange={(e) => setReportForm({ ...reportForm, solution: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl text-xs border dark:bg-slate-700 dark:border-slate-600" 
                />
              </div>
            </div>

            {/* --- UPLOAD DOKUMENTASI MODERN --- */}
            <div className="pt-2 border-t dark:border-slate-700">
              <div className="flex justify-between items-center mb-2">
                <label className="text-xs font-bold text-slate-700 dark:text-slate-200 block">
                  📷 Dokumentasi Kegiatan {CONFIG.REQUIRE_PHOTO_DOCUMENTATION && <span className="text-red-500">*</span>}
                </label>
                <span className="text-[11px] font-semibold text-slate-400">
                  {photoList.length} Foto Dipilih
                </span>
              </div>

              {/* UPLOAD BOX */}
              <div 
                onDragOver={handleDragOver}
                onDragLeave={handleDragLeave}
                onDrop={handleDrop}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className={`border-2 border-dashed rounded-2xl p-6 text-center cursor-pointer transition ${
                  isDragging 
                    ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/30' 
                    : 'border-slate-300 dark:border-slate-600 hover:border-indigo-400 dark:hover:border-indigo-500 bg-slate-50/50 dark:bg-slate-700/30'
                }`}
              >
                <input 
                  type="file" 
                  ref={fileInputRef} 
                  onChange={(e) => e.target.files && handleFileSelect(e.target.files)} 
                  multiple 
                  accept="image/jpeg,image/png,image/webp" 
                  className="hidden" 
                />
                <div className="w-10 h-10 bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-300 rounded-full flex items-center justify-center mx-auto mb-2">
                  <Icon name="camera" size={20} />
                </div>
                <p className="text-xs font-bold text-slate-700 dark:text-slate-200">Upload Dokumentasi</p>
                <p className="text-[11px] text-slate-400 mt-0.5">Klik untuk memilih foto atau drag & drop file di sini</p>
                <p className="text-[10px] font-semibold text-indigo-600 dark:text-indigo-400 mt-2">JPG • PNG • WEBP • Max 5 MB</p>
              </div>

              {/* ERROR MESSAGES */}
              {uploadError && (
                <div className="mt-2 p-2.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold rounded-xl flex items-center gap-2">
                  <Icon name="alert-circle" size={16} />
                  <span>{uploadError}</span>
                </div>
              )}
              {formErrors.photos && (
                <p className="text-[11px] text-red-500 font-bold mt-1.5">{formErrors.photos}</p>
              )}

              {/* PREVIEW THUMBNAILS GRID */}
              {photoList.length > 0 && (
                <div className="mt-4 space-y-2">
                  <p className="text-[11px] font-bold text-slate-400 uppercase">Preview Foto ({photoList.length})</p>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {photoList.map((photo, index) => (
                      <div key={photo.photo_id} className="relative group rounded-xl overflow-hidden border dark:border-slate-700 bg-slate-100 dark:bg-slate-900 aspect-video">
                        <img src={photo.file_url} className="w-full h-full object-cover" alt={`Foto ${index + 1}`} />
                        <div className="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2">
                          <button 
                            type="button" 
                            onClick={() => handleRemovePhoto(photo.photo_id)} 
                            className="p-1.5 bg-rose-600 text-white rounded-lg hover:bg-rose-700 transition"
                            title="Hapus Foto"
                          >
                            <Icon name="trash-2" size={14} />
                          </button>
                        </div>
                        <span className="absolute bottom-1 left-1 bg-slate-900/70 text-white text-[9px] px-1.5 py-0.5 rounded font-bold">
                          Foto {index + 1}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition">
              {isEditing ? 'Simpan Perubahan Laporan' : 'Simpan & Kirim Laporan'}
            </button>
          </form>
        </div>
      );
    };

    const StudentsView = ({ students }) => (
      <div className="space-y-4 animate-fadeIn">
        <h2 className="text-lg font-bold">Daftar Siswa Bimbingan</h2>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {students.map(s => (
            <div key={s.id} className="p-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
              <div className="flex items-center gap-4">
                <UserAvatar src={s.avatar} name={s.name} size="lg" />
                <div>
                  <h3 className="font-bold text-sm">{s.name}</h3>
                  <p className="text-xs text-slate-400">{s.class} • NIS: {s.nis}</p>
                  <p className="text-xs font-medium text-indigo-600 dark:text-indigo-400 mt-1">{s.internship}</p>
                </div>
              </div>
              <span className="text-xs px-2.5 py-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-400 rounded-lg font-bold">{s.status}</span>
            </div>
          ))}
        </div>
      </div>
    );

    // --- ENHANCED PROFILE VIEW WITH FULL PROFILE PICTURE MANAGEMENT ---
    const ProfileView = ({ currentUser, onUpdateAvatar }) => {
      const profileFileInputRef = useRef(null);
      const [editingImageSrc, setEditingImageSrc] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');

      const handleProfileFileChange = (e) => {
        setErrorMsg('');
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        // Backend-like validation
        if (!CONFIG.ALLOWED_FILE_TYPES.includes(file.type)) {
          setErrorMsg('Format file tidak didukung! Gunakan format JPG, PNG, atau WEBP.');
          return;
        }

        if (file.size > CONFIG.MAX_FILE_SIZE_MB * 1024 * 1024) {
          setErrorMsg(`Ukuran file foto profil melebihi ${CONFIG.MAX_FILE_SIZE_MB} MB!`);
          return;
        }

        // Generate temporary URL to edit
        const tempUrl = URL.createObjectURL(file);
        setEditingImageSrc(tempUrl);
      };

      const handleOpenEditorForCurrent = () => {
        if (currentUser.avatar) {
          setEditingImageSrc(currentUser.avatar);
        } else {
          profileFileInputRef.current && profileFileInputRef.current.click();
        }
      };

      const handleSaveEditedAvatar = (newBase64Avatar) => {
        // Update profile photo in state/database
        onUpdateAvatar(newBase64Avatar);
        setEditingImageSrc(null);
      };

      const handleDeleteAvatar = () => {
        if (confirm("Apakah Anda yakin ingin menghapus foto profil? Foto profil akan digantikan dengan avatar default.")) {
          onUpdateAvatar(''); // Clear avatar to use default initials
        }
      };

      return (
        <div className="max-w-xl mx-auto bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6 animate-fadeIn">
          
          {/* PROFILE HEADER & AVATAR ACTION BUTTONS */}
          <div className="flex flex-col sm:flex-row items-center gap-6 pb-6 border-b dark:border-slate-700">
            <div className="relative group">
              <UserAvatar src={currentUser.avatar} name={currentUser.name} size="profile" />
              <button 
                type="button" 
                onClick={handleOpenEditorForCurrent}
                className="absolute inset-0 bg-slate-900/40 rounded-3xl opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold gap-1"
                title="Edit Foto"
              >
                <Icon name="edit-2" size={16} /> Edit
              </button>
            </div>

            <div className="text-center sm:text-left space-y-2 flex-1">
              <div>
                <h2 className="text-lg font-bold">{currentUser.name}</h2>
                <p className="text-xs text-slate-400 capitalize">{currentUser.role === 'student' ? 'Siswa PKL' : 'Guru Pembimbing'}</p>
                <p className="text-xs text-indigo-600 dark:text-indigo-400 font-medium mt-0.5">{currentUser.email}</p>
              </div>

              {/* ACTION BUTTONS */}
              <div className="flex flex-wrap items-center justify-center sm:justify-start gap-2 pt-1">
                {currentUser.avatar && (
                  <button 
                    type="button" 
                    onClick={handleOpenEditorForCurrent} 
                    className="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-[11px] font-bold hover:bg-slate-200 transition flex items-center gap-1"
                  >
                    <Icon name="crop" size={13} /> Edit Foto
                  </button>
                )}
                
                <button 
                  type="button" 
                  onClick={() => profileFileInputRef.current && profileFileInputRef.current.click()} 
                  className="px-2.5 py-1.5 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-300 rounded-xl text-[11px] font-bold hover:bg-indigo-100 transition flex items-center gap-1"
                >
                  <Icon name="upload" size={13} /> {currentUser.avatar ? 'Ganti Foto' : 'Upload Foto'}
                </button>

                {currentUser.avatar && (
                  <button 
                    type="button" 
                    onClick={handleDeleteAvatar} 
                    className="px-2.5 py-1.5 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 rounded-xl text-[11px] font-bold hover:bg-rose-100 transition flex items-center gap-1"
                  >
                    <Icon name="trash-2" size={13} /> 🗑️ Hapus Foto
                  </button>
                )}

                <input 
                  type="file" 
                  ref={profileFileInputRef} 
                  onChange={handleProfileFileChange} 
                  accept="image/jpeg,image/png,image/webp" 
                  className="hidden" 
                />
              </div>

              {errorMsg && (
                <p className="text-[11px] text-rose-500 font-bold pt-1">{errorMsg}</p>
              )}
            </div>
          </div>

          {/* USER INFORMATION TABLE */}
          <div className="space-y-3 text-xs">
            {currentUser.role === 'student' ? (
              <>
                <div className="flex justify-between py-1 border-b dark:border-slate-700"><span className="text-slate-400">NIS</span><span className="font-semibold">{currentUser.nis}</span></div>
                <div className="flex justify-between py-1 border-b dark:border-slate-700"><span className="text-slate-400">Kelas / Jurusan</span><span className="font-semibold">{currentUser.class} ({currentUser.major})</span></div>
                <div className="flex justify-between py-1 border-b dark:border-slate-700"><span className="text-slate-400">Sekolah</span><span className="font-semibold">{currentUser.school}</span></div>
                <div className="flex justify-between py-1 border-b dark:border-slate-700"><span className="text-slate-400">Tempat PKL</span><span className="font-semibold">{currentUser.internship}</span></div>
                <div className="flex justify-between py-1"><span className="text-slate-400">Periode</span><span className="font-semibold">{currentUser.startDate} s/d {currentUser.endDate}</span></div>
              </>
            ) : (
              <>
                <div className="flex justify-between py-1 border-b dark:border-slate-700"><span className="text-slate-400">NIP</span><span className="font-semibold">{currentUser.nip}</span></div>
                <div className="flex justify-between py-1 border-b dark:border-slate-700"><span className="text-slate-400">Jabatan</span><span className="font-semibold">{currentUser.position}</span></div>
                <div className="flex justify-between py-1 border-b dark:border-slate-700"><span className="text-slate-400">Departemen</span><span className="font-semibold">{currentUser.department}</span></div>
                <div className="flex justify-between py-1"><span className="text-slate-400">Instansi</span><span className="font-semibold">{currentUser.institution}</span></div>
              </>
            )}
          </div>

          {/* IMAGE CROPPER MODAL IF USER SELECTS A PHOTO TO EDIT */}
          {editingImageSrc && (
            <ProfilePictureEditorModal 
              imageSrc={editingImageSrc} 
              onClose={() => setEditingImageSrc(null)} 
              onSave={handleSaveEditedAvatar} 
            />
          )}
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---
    const App = () => {
      const [authMode, setAuthMode] = useState('siswa');
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [darkMode, setDarkMode] = useState(false);

      const [supervisors, setSupervisors] = useState(INITIAL_SUPERVISORS);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [reports, setReports] = useState(INITIAL_REPORTS);
      const [photos, setPhotos] = useState(INITIAL_PHOTOS);

      const [selectedReport, setSelectedReport] = useState(null);
      const [statusFilter, setStatusFilter] = useState('Semua');
      const [reviewNote, setReviewNote] = useState('');
      
      const [activeZoomImage, setActiveZoomImage] = useState(null);
      const [editingReportId, setEditingReportId] = useState(null);

      const [reportForm, setReportForm] = useState({
        date: new Date().toISOString().split('T')[0],
        attendance: 'Hadir',
        checkIn: '08:00',
        checkOut: '16:00',
        title: '',
        description: '',
        result: '',
        obstacles: '',
        solution: ''
      });
      const [photoList, setPhotoList] = useState([]);
      const [formErrors, setFormErrors] = useState({});
      const [uploadError, setUploadError] = useState('');

      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
        document.documentElement.classList.toggle('dark');
      };

      const handleLogin = (user, pass) => {
        if (authMode === 'siswa') {
          const found = students.find(s => s.username === user);
          if (found) { setCurrentUser(found); return true; }
        } else {
          const found = supervisors.find(s => s.username === user);
          if (found) { setCurrentUser(found); return true; }
        }
        return false;
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setActiveTab('dashboard');
      };

      // --- AVATAR UPDATE SYSTEM (CONSISTENT PROFILE PHOTO ACROSS SYSTEM) ---
      const handleUpdateUserAvatar = (newAvatar) => {
        if (!currentUser) return;

        // Update current user state
        const updatedUser = { ...currentUser, avatar: newAvatar };
        setCurrentUser(updatedUser);

        // Update relational tables to ensure consistency across whole app
        if (currentUser.role === 'student') {
          setStudents(students.map(s => s.id === currentUser.id ? updatedUser : s));
        } else {
          setSupervisors(supervisors.map(sp => sp.id === currentUser.id ? updatedUser : sp));
        }
      };

      // --- EDIT INITIALIZER ---
      const handleStartEdit = (report) => {
        setEditingReportId(report.id);
        setReportForm({
          date: report.date,
          attendance: report.attendance,
          checkIn: report.checkIn,
          checkOut: report.checkOut,
          title: report.title,
          description: report.description,
          result: report.result || '',
          obstacles: report.obstacles || '',
          solution: report.solution || ''
        });

        const existingPhotos = photos.filter(p => p.report_id === report.id && !p.deleted_at);
        setPhotoList(existingPhotos);
        setFormErrors({});
        setUploadError('');
        setActiveTab('add-report');
      };

      const handleCancelEdit = () => {
        setEditingReportId(null);
        setReportForm({
          date: new Date().toISOString().split('T')[0],
          attendance: 'Hadir',
          checkIn: '08:00',
          checkOut: '16:00',
          title: '',
          description: '',
          result: '',
          obstacles: '',
          solution: ''
        });
        setPhotoList([]);
        setActiveTab('reports');
      };

      // --- CREATE & UPDATE REPORT WITH PHOTO RELATIONS ---
      const handleSaveReport = (e) => {
        e.preventDefault();
        const errs = {};
        if (!reportForm.date) errs.date = 'Tanggal wajib diisi';
        if (!reportForm.title) errs.title = 'Judul wajib diisi';
        if (!reportForm.description) errs.description = 'Deskripsi wajib diisi';

        if (CONFIG.REQUIRE_PHOTO_DOCUMENTATION && photoList.length === 0) {
          errs.photos = 'Silakan tambahkan minimal 1 foto dokumentasi sebelum mengirim laporan.';
        }

        if (Object.keys(errs).length > 0) {
          setFormErrors(errs);
          return;
        }

        let reportId = editingReportId;

        if (editingReportId) {
          setReports(reports.map(r => r.id === editingReportId ? { ...r, ...reportForm, status: 'Menunggu Review' } : r));
        } else {
          reportId = `rep-${Date.now()}`;
          const created = {
            ...reportForm,
            id: reportId,
            student_id: currentUser.id,
            supervisor_id: currentUser.supervisor_id,
            status: 'Menunggu Review',
            note: '',
            deleted_at: null
          };
          setReports([created, ...reports]);
        }

        const currentPhotoIds = photoList.map(p => p.photo_id);
        const updatedPhotos = photos.map(p => {
          if (p.report_id === reportId && !currentPhotoIds.includes(p.photo_id)) {
            return { ...p, deleted_at: new Date().toISOString() };
          }
          return p;
        });

        const newPhotosToAdd = photoList.filter(p => p.isNew).map((p, idx) => ({
          photo_id: `pho-${Date.now()}-${idx}`,
          report_id: reportId,
          file_url: p.file_url,
          file_name: p.file_name,
          uploaded_at: p.uploaded_at,
          deleted_at: null
        }));

        setPhotos([...updatedPhotos.filter(p => !newPhotosToAdd.some(np => np.photo_id === p.photo_id)), ...newPhotosToAdd]);

        setEditingReportId(null);
        setReportForm({
          date: new Date().toISOString().split('T')[0],
          attendance: 'Hadir',
          checkIn: '08:00',
          checkOut: '16:00',
          title: '',
          description: '',
          result: '',
          obstacles: '',
          solution: ''
        });
        setPhotoList([]);
        setFormErrors({});
        setUploadError('');
        setActiveTab('reports');
      };

      const handleDeleteReport = (id) => {
        if (confirm('Apakah Anda yakin ingin menghapus laporan ini? Semua foto dokumentasi terkait juga akan dihapus.')) {
          const timestamp = new Date().toISOString();
          setReports(reports.map(r => r.id === id ? { ...r, deleted_at: timestamp } : r));
          setPhotos(photos.map(p => p.report_id === id ? { ...p, deleted_at: timestamp } : p));
        }
      };

      const handleReviewReport = (status) => {
        setReports(reports.map(r => r.id === selectedReport.id ? { ...r, status, note: reviewNote } : r));
        setSelectedReport(null);
        setReviewNote('');
      };

      if (!currentUser) {
        return authMode === 'siswa' 
          ? <LoginSiswaView onLogin={handleLogin} onSwitch={() => setAuthMode('pembimbing')} />
          : <LoginPembimbingView onLogin={handleLogin} onSwitch={() => setAuthMode('siswa')} />;
      }

      const isStudent = currentUser.role === 'student';
      const filteredReports = reports.filter(r => {
        if (r.deleted_at) return false;
        const matchesUser = isStudent ? r.student_id === currentUser.id : r.supervisor_id === currentUser.id;
        const matchesStatus = statusFilter === 'Semua' ? true : r.status === statusFilter;
        return matchesUser && matchesStatus;
      });

      const pendingCount = reports.filter(r => r.supervisor_id === currentUser.id && r.status === 'Menunggu Review' && !r.deleted_at).length;

      return (
        <div className="flex h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 overflow-hidden">
          
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between p-4 shrink-0">
            <div className="space-y-6">
              <div className="flex items-center gap-3 px-2">
                <div className="w-9 h-9 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-black text-sm">
                  PKL
                </div>
                <div>
                  <h1 className="font-bold text-sm leading-tight">PKL Report</h1>
                  <p className="text-[10px] text-slate-400 font-medium">Dashboard System</p>
                </div>
              </div>

              <nav className="space-y-1">
                <NavItem 
                  icon="layout-dashboard" 
                  label="Dashboard" 
                  active={activeTab === 'dashboard'} 
                  onClick={() => { setEditingReportId(null); setActiveTab('dashboard'); }} 
                />
                <NavItem 
                  icon="file-text" 
                  label={isStudent ? "Laporan Saya" : "Review Laporan"} 
                  active={activeTab === 'reports'} 
                  onClick={() => { setEditingReportId(null); setActiveTab('reports'); }} 
                  badge={!isStudent ? pendingCount : 0}
                />
                {isStudent && (
                  <NavItem 
                    icon="plus-circle" 
                    label="Buat Laporan" 
                    active={activeTab === 'add-report'} 
                    onClick={() => {
                      setEditingReportId(null);
                      setReportForm({
                        date: new Date().toISOString().split('T')[0],
                        attendance: 'Hadir',
                        checkIn: '08:00',
                        checkOut: '16:00',
                        title: '',
                        description: '',
                        result: '',
                        obstacles: '',
                        solution: ''
                      });
                      setPhotoList([]);
                      setActiveTab('add-report');
                    }} 
                  />
                )}
                {!isStudent && (
                  <NavItem 
                    icon="users" 
                    label="Siswa Bimbingan" 
                    active={activeTab === 'students'} 
                    onClick={() => setActiveTab('students')} 
                  />
                )}
                <NavItem 
                  icon="user" 
                  label="Profil" 
                  active={activeTab === 'profile'} 
                  onClick={() => setActiveTab('profile')} 
                />
              </nav>
            </div>

            <div className="space-y-3 pt-4 border-t dark:border-slate-700">
              <button 
                onClick={toggleDarkMode}
                className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
              >
                <Icon name={darkMode ? "sun" : "moon"} size={18} />
                <span>{darkMode ? "Mode Terang" : "Mode Gelap"}</span>
              </button>

              <div className="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-700/50">
                <div className="flex items-center gap-2.5 overflow-hidden">
                  <UserAvatar src={currentUser.avatar} name={currentUser.name} size="sm" />
                  <div className="truncate">
                    <p className="text-xs font-bold truncate">{currentUser.name}</p>
                    <p className="text-[10px] text-slate-400 capitalize">{currentUser.role}</p>
                  </div>
                </div>
                <button onClick={handleLogout} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition" title="Logout">
                  <Icon name="log-out" size={16} />
                </button>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 overflow-y-auto p-8">
            {activeTab === 'dashboard' && (
              isStudent 
                ? <StudentDashboard user={currentUser} supervisor={supervisors.find(s => s.id === currentUser.supervisor_id)} reports={filteredReports} setActiveTab={setActiveTab} />
                : <SupervisorDashboard user={currentUser} students={students} reports={reports.filter(r => !r.deleted_at)} photos={photos} setActiveTab={setActiveTab} onSelectReport={setSelectedReport} />
            )}

            {activeTab === 'reports' && (
              <ReportsView 
                reports={filteredReports} 
                photos={photos}
                isStudent={isStudent} 
                onSelectReport={setSelectedReport} 
                onEditReport={handleStartEdit}
                onDeleteReport={handleDeleteReport}
                statusFilter={statusFilter}
                setStatusFilter={setStatusFilter}
              />
            )}

            {activeTab === 'add-report' && isStudent && (
              <AddReportView 
                reportForm={reportForm} 
                setReportForm={setReportForm} 
                photoList={photoList}
                setPhotoList={setPhotoList}
                formErrors={formErrors} 
                uploadError={uploadError}
                setUploadError={setUploadError}
                isEditing={!!editingReportId}
                onSubmit={handleSaveReport} 
                onCancel={handleCancelEdit}
              />
            )}

            {activeTab === 'students' && !isStudent && (
              <StudentsView students={students} />
            )}

            {activeTab === 'profile' && (
              <ProfileView currentUser={currentUser} onUpdateAvatar={handleUpdateUserAvatar} />
            )}
          </main>

          {/* DETAIL & REVIEW MODAL WITH GALLERY */}
          {selectedReport && (
            <Modal title="Detail Laporan Kegiatan" onClose={() => setSelectedReport(null)}>
              <div className="space-y-4 text-xs">
                <div className="flex justify-between items-start pb-3 border-b dark:border-slate-700">
                  <div>
                    <h4 className="font-bold text-sm">{selectedReport.title}</h4>
                    <p className="text-slate-400 mt-0.5">{selectedReport.date} • {selectedReport.checkIn} - {selectedReport.checkOut}</p>
                  </div>
                  <StatusBadge status={selectedReport.status} />
                </div>

                <div className="space-y-3">
                  <div>
                    <strong className="text-slate-400 block mb-1">Deskripsi Pekerjaan:</strong>
                    <p className="p-2.5 bg-slate-50 dark:bg-slate-700/50 rounded-xl leading-relaxed">{selectedReport.description}</p>
                  </div>

                  <div>
                    <strong className="text-slate-400 block mb-1">Hasil Pekerjaan:</strong>
                    <p className="p-2.5 bg-slate-50 dark:bg-slate-700/50 rounded-xl">{selectedReport.result || '-'}</p>
                  </div>

                  {selectedReport.obstacles && (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <strong className="text-slate-400 block mb-1">Kendala:</strong>
                        <p className="p-2.5 bg-rose-50 dark:bg-rose-950/30 text-rose-700 dark:text-rose-300 rounded-xl">{selectedReport.obstacles}</p>
                      </div>
                      <div>
                        <strong className="text-slate-400 block mb-1">Solusi:</strong>
                        <p className="p-2.5 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-300 rounded-xl">{selectedReport.solution}</p>
                      </div>
                    </div>
                  )}

                  {/* GALERI FOTO DOKUMENTASI TERKAIT REPORT_ID */}
                  <div className="pt-2">
                    <strong className="text-slate-700 dark:text-slate-200 block mb-2 flex items-center justify-between">
                      <span className="flex items-center gap-1.5">
                        <Icon name="camera" size={16} /> 📷 Dokumentasi Kegiatan
                      </span>
                      <span className="text-[10px] font-normal text-slate-400">
                        {photos.filter(p => p.report_id === selectedReport.id && !p.deleted_at).length} Foto Terlampir
                      </span>
                    </strong>

                    {photos.filter(p => p.report_id === selectedReport.id && !p.deleted_at).length === 0 ? (
                      <p className="p-3 bg-slate-50 dark:bg-slate-700/30 rounded-xl text-slate-400 text-center italic">
                        Tidak ada foto dokumentasi untuk laporan ini.
                      </p>
                    ) : (
                      <div className="grid grid-cols-3 gap-2">
                        {photos.filter(p => p.report_id === selectedReport.id && !p.deleted_at).map((photo, idx) => (
                          <div 
                            key={photo.photo_id} 
                            onClick={() => setActiveZoomImage(photo.file_url)}
                            className="aspect-video bg-slate-100 dark:bg-slate-900 rounded-xl overflow-hidden border dark:border-slate-700 cursor-pointer hover:opacity-90 transition relative group"
                          >
                            <img src={photo.file_url} alt={`Dokumentasi ${idx + 1}`} className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white">
                              <Icon name="maximize-2" size={16} />
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {selectedReport.note && (
                    <div className="pt-2">
                      <strong className="text-slate-400 block mb-1">Catatan Pembimbing:</strong>
                      <p className="p-2.5 bg-amber-50 dark:bg-amber-950/30 text-amber-800 dark:text-amber-300 rounded-xl italic">"{selectedReport.note}"</p>
                    </div>
                  )}
                </div>

                {/* SUPERVISOR REVIEW FORM */}
                {!isStudent && selectedReport.status === 'Menunggu Review' && (
                  <div className="pt-4 border-t dark:border-slate-700 space-y-3">
                    <label className="font-bold block">Beri Catatan / Feedback:</label>
                    <textarea 
                      rows={2}
                      value={reviewNote} 
                      onChange={(e) => setReviewNote(e.target.value)}
                      placeholder="Tuliskan masukan untuk siswa..."
                      className="w-full p-2.5 rounded-xl border dark:bg-slate-700 dark:border-slate-600 text-xs"
                    />
                    <div className="flex gap-2">
                      <button 
                        onClick={() => handleReviewReport('Disetujui')} 
                        className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition"
                      >
                        Setujui Laporan
                      </button>
                      <button 
                        onClick={() => handleReviewReport('Ditolak')} 
                        className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition"
                      >
                        Tolak Laporan
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </Modal>
          )}

          {/* LIGHTBOX PREVIEW FOTO KEBESAR */}
          {activeZoomImage && (
            <div 
              onClick={() => setActiveZoomImage(null)} 
              className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer animate-fadeIn"
            >
              <div className="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center justify-center" onClick={e => e.stopPropagation()}>
                <img src={activeZoomImage} className="max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain border border-slate-700" alt="Preview Foto Dokumentasi Besar" />
                <button 
                  onClick={() => setActiveZoomImage(null)}
                  className="absolute -top-10 right-0 text-white hover:text-slate-300 flex items-center gap-1 text-xs font-bold bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-600"
                >
                  <Icon name="x" size={16} /> Tutup Preview
                </button>
              </div>
            </div>
          )}

        </div>
      );
    };

    // MOUNT TO DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
