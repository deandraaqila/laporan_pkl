                className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-1.5"
              >
                <Icon name="file-text" size={14} /> Export Excel
              </button>
              <button 
                onClick={onExportPDF}
                className="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-1.5"
              >
                <Icon name="printer" size={14} /> Export PDF
              </button>
            </div>
          </div>

          <div className="space-y-4">
            {reports.length === 0 ? (
              <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl text-center text-slate-400 space-y-2 border border-slate-200 dark:border-slate-700">
                <Icon name="inbox" size={32} className="mx-auto" />
                <p className="text-xs font-medium">Belum ada data laporan harian yang ditemukan.</p>
              </div>
            ) : (
              reports.map(r => {
                const repPhotos = photos.filter(p => p.report_id === r.id && !p.deleted_at);
                return (
                  <div 
                    key={r.id} 
                    className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition space-y-3"
                  >
                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                      <div className="flex items-center gap-3">
                        <span className="text-xs font-bold text-slate-400 bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-lg">
                          {r.date}
                        </span>
                        <StatusBadge status={r.attendance} />
                        <StatusBadge status={r.status} />
                      </div>
                      <div className="flex items-center gap-2 text-xs font-semibold text-slate-500">
                        <Icon name="clock" size={14} />
                        <span>{r.checkIn} - {r.checkOut} WIB</span>
                      </div>
                    </div>

                    <div>
                      <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">{r.title}</h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">{r.description}</p>
                    </div>

                    {repPhotos.length > 0 && (
                      <div className="flex items-center gap-2 pt-1">
                        <span className="text-[11px] font-bold text-slate-400">Dokumentasi:</span>
                        <div className="flex gap-1.5 overflow-x-auto py-1">
                          {repPhotos.map(p => (
                            <img 
                              key={p.photo_id} 
                              src={p.file_url} 
                              alt={p.file_name} 
                              className="w-10 h-10 object-cover rounded-lg border dark:border-slate-700 hover:scale-105 transition"
                            />
                          ))}
                        </div>
                      </div>
                    )}

                    {r.note && (
                      <div className="p-3 bg-indigo-50 dark:bg-indigo-950/40 rounded-xl border border-indigo-100 dark:border-indigo-900/50 text-xs text-indigo-700 dark:text-indigo-300">
                        <strong>Catatan Pembimbing:</strong> {r.note}
                      </div>
                    )}

                    <div className="flex justify-between items-center pt-2 border-t dark:border-slate-700/50 text-xs font-bold">
                      <button 
                        onClick={() => onSelectReport(r)} 
                        className="text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1"
                      >
                        <Icon name="eye" size={14} /> Lihat Detail Laporan
                      </button>

                      {isStudent && r.status !== 'Disetujui' && (
                        <div className="flex items-center gap-3">
                          <button 
                            onClick={() => onEditReport(r)} 
                            className="text-amber-600 hover:underline flex items-center gap-1"
                          >
                            <Icon name="edit-3" size={14} /> Edit
                          </button>
                          <button 
                            onClick={() => onDeleteReport(r.id)} 
                            className="text-rose-600 hover:underline flex items-center gap-1"
                          >
                            <Icon name="trash-2" size={14} /> Hapus
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    };

    // --- COMPONENT: REPORT DETAIL MODAL ---
    const ReportDetailModal = ({ report, photos, isStudent, onClose, onApprove, onReject, onExportSinglePDF, onExportSingleExcel }) => {
      const [note, setNote] = useState(report.note || '');
      const [lightboxPhoto, setLightboxPhoto] = useState(null);
      const repPhotos = photos.filter(p => p.report_id === report.id && !p.deleted_at);

      return (
        <>
          <Modal title="Detail Laporan Kegiatan PKL" onClose={onClose}>
            <div className="space-y-4 text-xs">
              <div className="flex flex-wrap justify-between items-center gap-2 p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl">
                <div>
                  <p className="text-slate-400 font-bold uppercase text-[10px]">Tanggal & Presensi</p>
                  <p className="font-bold text-slate-700 dark:text-slate-200 mt-0.5">{report.date} ({report.checkIn} - {report.checkOut})</p>
                </div>
                <div className="flex gap-2">
                  <StatusBadge status={report.attendance} />
                  <StatusBadge status={report.status} />
                </div>
              </div>

              <div className="space-y-1">
                <label className="font-bold text-slate-400 uppercase text-[10px]">Judul Pekerjaan</label>
                <h4 className="font-bold text-sm text-slate-800 dark:text-slate-100">{report.title}</h4>
              </div>

              <div className="space-y-1">
                <label className="font-bold text-slate-400 uppercase text-[10px]">Deskripsi Kegiatan</label>
                <p className="bg-slate-50 dark:bg-slate-700/30 p-3 rounded-xl border border-slate-100 dark:border-slate-700 leading-relaxed">
                  {report.description}
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-400 uppercase text-[10px]">Hasil Pekerjaan</label>
                  <p className="bg-slate-50 dark:bg-slate-700/30 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700 mt-1">
                    {report.result || '-'}
                  </p>
                </div>
                <div>
                  <label className="font-bold text-slate-400 uppercase text-[10px]">Kendala & Solusi</label>
                  <p className="bg-slate-50 dark:bg-slate-700/30 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700 mt-1">
                    {report.obstacles ? `${report.obstacles} (Solusi: ${report.solution || '-'})` : '-'}
                  </p>
                </div>
              </div>

              <div className="space-y-2">
                <label className="font-bold text-slate-400 uppercase text-[10px]">Foto Dokumentasi Kegiatan</label>
                {repPhotos.length === 0 ? (
                  <p className="text-slate-400 italic">Tidak ada lampiran foto.</p>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {repPhotos.map(p => (
                      <div 
                        key={p.photo_id} 
                        onClick={() => setLightboxPhoto(p)}
                        className="group relative rounded-xl overflow-hidden border dark:border-slate-700 cursor-pointer aspect-square"
                      >
                        <img src={p.file_url} alt={p.file_name} className="w-full h-full object-cover group-hover:scale-105 transition" />
                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white font-bold text-[10px]">
                          Perbesar 🔍
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="flex gap-2 pt-2 border-t dark:border-slate-700">
                <button 
                  onClick={() => onExportSingleExcel(report)}
                  className="flex-1 py-2 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 font-bold rounded-xl hover:bg-emerald-100 transition flex items-center justify-center gap-1"
                >
                  <Icon name="file-text" size={14} /> Export Excel
                </button>
                <button 
                  onClick={() => onExportSinglePDF(report)}
                  className="flex-1 py-2 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 font-bold rounded-xl hover:bg-rose-100 transition flex items-center justify-center gap-1"
                >
                  <Icon name="printer" size={14} /> Export PDF
                </button>
              </div>

              {!isStudent && (
                <div className="pt-3 border-t dark:border-slate-700 space-y-3">
                  <div>
                    <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Catatan / Masukan Pembimbing</label>
                    <textarea 
                      rows="3" 
                      value={note} 
                      onChange={(e) => setNote(e.target.value)}
                      className="w-full p-3 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-indigo-500"
                      placeholder="Berikan masukan atau arahan untuk siswa..."
                    />
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => onReject(report.id, note)} 
                      className="flex-1 py-2.5 bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-400 font-bold rounded-xl hover:bg-rose-200 transition"
                    >
                      Tolak Laporan
                    </button>
                    <button 
                      onClick={() => onApprove(report.id, note)} 
                      className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition"
                    >
                      Setujui Laporan
                    </button>
                  </div>
                </div>
              )}
            </div>
          </Modal>

          <LightboxModal photo={lightboxPhoto} onClose={() => setLightboxPhoto(null)} />
        </>
      );
    };

    // --- COMPONENT: ADD / EDIT REPORT FORM VIEW ---
    const AddReportView = ({ reportToEdit, onSubmit, onCancel, photos }) => {
      const [formData, setFormData] = useState({
        date: reportToEdit ? reportToEdit.date : new Date().toISOString().split('T')[0],
        attendance: reportToEdit ? reportToEdit.attendance : 'Hadir',
        checkIn: reportToEdit ? reportToEdit.checkIn : '08:00',
        checkOut: reportToEdit ? reportToEdit.checkOut : '17:00',
        title: reportToEdit ? reportToEdit.title : '',
        description: reportToEdit ? reportToEdit.description : '',
        result: reportToEdit ? reportToEdit.result : '',
        obstacles: reportToEdit ? reportToEdit.obstacles : '',
        solution: reportToEdit ? reportToEdit.solution : ''
      });

      const [uploadingPhotos, setUploadingPhotos] = useState([]);
      const [err, setErr] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);

      useEffect(() => {
        if (reportToEdit) {
          const existing = photos.filter(p => p.report_id === reportToEdit.id && !p.deleted_at);
          setUploadingPhotos(existing.map(p => ({ id: p.photo_id, url: p.file_url, name: p.file_name })));
        }
      }, [reportToEdit, photos]);

      const handleFileChange = async (e) => {
        const files = Array.from(e.target.files);
        setErr('');
        setIsProcessing(true);

        for (const file of files) {
          if (!CONFIG.ALLOWED_FILE_TYPES.includes(file.type)) {
            setErr('Format file harus berupa JPG, PNG, atau WEBP!');
            continue;
          }
          if (file.size > CONFIG.MAX_FILE_SIZE_MB * 1024 * 1024) {
            setErr(`Ukuran file maksimal ${CONFIG.MAX_FILE_SIZE_MB}MB!`);
            continue;
          }

          try {
            const compressed = await compressImage(file);
            setUploadingPhotos(prev => [...prev, {
              id: 'temp-' + Date.now() + Math.random(),
              url: compressed,
              name: file.name
            }]);
          } catch (err) {
            console.error('Compress error:', err);
            setErr('Gagal memproses gambar.');
          }
        }
        setIsProcessing(false);
        e.target.value = '';
      };

      const handleRemovePhoto = (id) => {
        setUploadingPhotos(prev => prev.filter(p => p.id !== id));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.description) {
          setErr('Judul dan Deskripsi kegiatan wajib diisi!');
          return;
        }

        if (CONFIG.REQUIRE_PHOTO_DOCUMENTATION && uploadingPhotos.length === 0) {
          setErr('Dokumentasi foto wajib diunggah sesuai kebijakan!');
          return;
        }

        onSubmit(formData, uploadingPhotos);
      };

      return (
        <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6 animate-fadeIn max-w-3xl mx-auto">
          <div className="flex justify-between items-center pb-4 border-b dark:border-slate-700">
            <div>
              <h2 className="text-lg font-bold">{reportToEdit ? 'Edit Laporan PKL' : 'Buat Laporan Kegiatan Harian'}</h2>
              <p className="text-xs text-slate-400">Isi detail aktivitas kerja harian yang telah kamu selesaikan</p>
            </div>
            {onCancel && (
              <button onClick={onCancel} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-xl text-xs font-bold">
                Batal
              </button>
            )}
          </div>

          {err && <div className="p-3 bg-rose-100 border border-rose-200 text-rose-700 text-xs font-semibold rounded-xl">{err}</div>}

          <form onSubmit={handleSubmit} className="space-y-4 text-xs">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Tanggal Kegiatan</label>
                <input 
                  type="date" 
                  value={formData.date} 
                  onChange={(e) => setFormData({...formData, date: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Status Kehadiran</label>
                <select 
                  value={formData.attendance} 
                  onChange={(e) => setFormData({...formData, attendance: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 font-semibold"
                >
                  <option value="Hadir">Hadir</option>
                  <option value="Izin">Izin</option>
                  <option value="Sakit">Sakit</option>
                </select>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Jam Masuk</label>
                  <input 
                    type="time" 
                    value={formData.checkIn} 
                    onChange={(e) => setFormData({...formData, checkIn: e.target.value})}
                    className="w-full px-2 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Jam Pulang</label>
                  <input 
                    type="time" 
                    value={formData.checkOut} 
                    onChange={(e) => setFormData({...formData, checkOut: e.target.value})}
                    className="w-full px-2 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                  />
                </div>
              </div>
            </div>

            <div>
              <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Judul / Sektor Pekerjaan *</label>
              <input 
                type="text" 
                placeholder="Contoh: Konfigurasi Router Mikrotik & Audit Kabel LAN" 
                value={formData.title} 
                onChange={(e) => setFormData({...formData, title: e.target.value})}
                className="w-full px-4 py-2.5 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
              />
            </div>

            <div>
              <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Deskripsi Kegiatan Lengkap *</label>
              <textarea 
                rows="4" 
                placeholder="Jelaskan secara rinci tahapan pekerjaan yang dilakukan hari ini..." 
                value={formData.description} 
                onChange={(e) => setFormData({...formData, description: e.target.value})}
                className="w-full p-3 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 leading-relaxed"
              />
            </div>

            <div>
              <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Hasil Pekerjaan / Output</label>
              <input 
                type="text" 
                placeholder="Contoh: Jaringan LAN aktif 100% di area kantor lantai 2" 
                value={formData.result} 
                onChange={(e) => setFormData({...formData, result: e.target.value})}
                className="w-full px-4 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
              />
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Kendala Dihadapi</label>
                <input 
                  type="text" 
                  placeholder="Kabel LAN terputus di switch 3" 
                  value={formData.obstacles} 
                  onChange={(e) => setFormData({...formData, obstacles: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                />
              </div>
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Solusi / Penanganan</label>
                <input 
                  type="text" 
                  placeholder="Melakukan crimping ulang konektor RJ45" 
                  value={formData.solution} 
                  onChange={(e) => setFormData({...formData, solution: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                />
              </div>
            </div>

            <div className="pt-2">
              <label className="font-bold text-slate-600 dark:text-slate-300 block mb-2">
                Unggah Foto Dokumentasi (Maks. 5MB, otomatis dikompres)
              </label>

              <div className="flex flex-wrap gap-3">
                {uploadingPhotos.map(p => (
                  <div key={p.id} className="relative w-24 h-24 rounded-2xl overflow-hidden border dark:border-slate-700 group shadow-sm">
                    <img src={p.url} alt={p.name} className="w-full h-full object-cover" />
                    <button 
                      type="button" 
                      onClick={() => handleRemovePhoto(p.id)} 
                      className="absolute top-1 right-1 bg-rose-600 text-white p-1 rounded-lg opacity-90 hover:opacity-100 transition"
                    >
                      <Icon name="x" size={12} />
                    </button>
                  </div>
                ))}

                <label className="w-24 h-24 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-indigo-500 flex flex-col items-center justify-center cursor-pointer text-slate-400 hover:text-indigo-600 transition bg-slate-50 dark:bg-slate-800">
                  {isProcessing ? (
                    <span className="text-[10px] font-bold">Memproses...</span>
                  ) : (
                    <>
                      <Icon name="camera" size={20} />
                      <span className="text-[10px] font-bold mt-1">+ Upload</span>
                    </>
                  )}
                  <input type="file" multiple accept="image/*" onChange={handleFileChange} className="hidden" disabled={isProcessing} />
                </label>
              </div>
            </div>

            <div className="pt-4 border-t dark:border-slate-700 flex justify-end">
              <button 
                type="submit" 
                disabled={isProcessing}
                className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow-lg transition"
              >
                {reportToEdit ? 'Simpan Perubahan' : 'Kirim Laporan Harian'}
              </button>
            </div>
          </form>
        </div>
      );
    };

    // --- COMPONENT: PROFILE VIEW ---
    const ProfileView = ({ user, isStudent, onUpdateProfile, onUpdateAvatar, onDeleteAvatar }) => {
      const [formData, setFormData] = useState({ ...user });
      const [editorImg, setEditorImg] = useState(null);
      const [isSaving, setIsSaving] = useState(false);

      useEffect(() => {
        setFormData({ ...user });
      }, [user]);

      const handleAvatarSelect = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > CONFIG.MAX_FILE_SIZE_MB * 1024 * 1024) {
            alert(`Ukuran foto maksimal ${CONFIG.MAX_FILE_SIZE_MB}MB!`);
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => setEditorImg(reader.result);
          reader.readAsDataURL(file);
        }
        e.target.value = '';
      };

      const handleSaveEditor = (croppedBase64) => {
        onUpdateAvatar(croppedBase64);
        setEditorImg(null);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSaving(true);
        onUpdateProfile(formData);
        setTimeout(() => setIsSaving(false), 500);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6 animate-fadeIn">
          <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-center gap-6">
            <div className="relative group">
              <UserAvatar src={user.avatar} name={user.name} size="profile" />
              <label className="absolute inset-0 bg-black/50 rounded-3xl flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition cursor-pointer">
                <Icon name="camera" size={20} />
                <input type="file" accept="image/*" onChange={handleAvatarSelect} className="hidden" />
              </label>
            </div>

            <div className="text-center sm:text-left space-y-2">
              <h3 className="text-lg font-bold">{user.name}</h3>
              <p className="text-xs text-slate-400 font-medium">
                {isStudent ? `${user.class} • ${user.school}` : `${user.position} • ${user.institution}`}
              </p>
              <div className="flex flex-wrap justify-center sm:justify-start gap-2 pt-1">
                <label className="px-3 py-1.5 bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 rounded-xl text-xs font-bold cursor-pointer hover:bg-indigo-100 transition">
                  Ganti Foto
                  <input type="file" accept="image/*" onChange={handleAvatarSelect} className="hidden" />
                </label>
                {user.avatar && (
                  <button 
                    type="button" 
                    onClick={onDeleteAvatar}
                    className="px-3 py-1.5 bg-rose-50 text-rose-600 dark:bg-rose-950/50 dark:text-rose-400 rounded-xl text-xs font-bold hover:bg-rose-100 transition"
                  >
                    Hapus Foto
                  </button>
                )}
              </div>
            </div>
          </div>

          <form onSubmit={handleSubmit} className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 text-xs">
            <h3 className="font-bold text-sm pb-2 border-b dark:border-slate-700">Informasi Pribadi & Kontak</h3>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Nama Lengkap</label>
                <input 
                  type="text" 
                  value={formData.name || ''} 
                  onChange={(e) => setFormData({...formData, name: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                />
              </div>
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Email</label>
                <input 
                  type="email" 
                  value={formData.email || ''} 
                  onChange={(e) => setFormData({...formData, email: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Nomor Telepon / WhatsApp</label>
                <input 
                  type="text" 
                  value={formData.phone || ''} 
                  onChange={(e) => setFormData({...formData, phone: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                />
              </div>
              <div>
                <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">
                  {isStudent ? 'Kelas & Jurusan' : 'Jabatan'}
                </label>
                <input 
                  type="text" 
                  value={isStudent ? (formData.class || '') : (formData.position || '')} 
                  onChange={(e) => setFormData({...formData, [isStudent ? 'class' : 'position']: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                />
              </div>
            </div>

            {isStudent && (
              <div className="space-y-4 pt-2">
                <h3 className="font-bold text-sm pb-2 border-b dark:border-slate-700">Informasi Tempat PKL / Magang</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Perusahaan Tempat PKL</label>
                    <input 
                      type="text" 
                      value={formData.internship || ''} 
                      onChange={(e) => setFormData({...formData, internship: e.target.value})}
                      className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Sekolah Asal</label>
                    <input 
                      type="text" 
                      value={formData.school || ''} 
                      onChange={(e) => setFormData({...formData, school: e.target.value})}
                      className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
                    />
                  </div>
                </div>
              </div>
            )}

            <div>
              <label className="font-bold text-slate-600 dark:text-slate-300 block mb-1">Alamat Lengkap</label>
              <textarea 
                rows="3" 
                value={formData.address || ''} 
                onChange={(e) => setFormData({...formData, address: e.target.value})}
                className="w-full p-3 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none"
              />
            </div>

            <div className="pt-4 flex justify-end">
              <button 
                type="submit" 
                className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow transition"
              >
                {isSaving ? 'Menyimpan...' : 'Simpan Perubahan Profil'}
              </button>
            </div>
          </form>

          {editorImg && (
            <ProfilePictureEditorModal 
              imageSrc={editorImg} 
              onClose={() => setEditorImg(null)} 
              onSave={handleSaveEditor} 
            />
          )}
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---
    const App = () => {
      // ==== AUTH & UI STATE ====
      const [portalRoute, setPortalRoute] = useState('student');
      const [currentUser, setCurrentUser] = useState(() => Storage.load(CONFIG.SESSION_KEY, null));
      const [activeTab, setActiveTab] = useState('dashboard');
      const [darkMode, setDarkMode] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // ==== DATA STATE (dengan initializer dari localStorage) ====
      const [supervisors, setSupervisors] = useState(() => Storage.load(CONFIG.STORAGE_KEY, null)?.supervisors || INITIAL_SUPERVISORS);
      const [students, setStudents] = useState(() => Storage.load(CONFIG.STORAGE_KEY, null)?.students || INITIAL_STUDENTS);
      const [reports, setReports] = useState(() => Storage.load(CONFIG.STORAGE_KEY, null)?.reports || INITIAL_REPORTS);
      const [photos, setPhotos] = useState(() => Storage.load(CONFIG.STORAGE_KEY, null)?.photos || INITIAL_PHOTOS);

      // ==== AUTO-SAVE ke localStorage ====
      useEffect(() => {
        const ok = Storage.save(CONFIG.STORAGE_KEY, { supervisors, students, reports, photos });
        if (!ok) {
          // Kalau gagal (storage penuh), kasih warning sekali aja
          if (!sessionStorage.getItem('storage_warned')) {
            alert('⚠️ Penyimpanan browser hampir penuh! Beberapa foto mungkin tidak tersimpan. Segera backup ke JSON dan reset data lama.');
            sessionStorage.setItem('storage_warned', '1');
          }
        }
      }, [supervisors, students, reports, photos]);

      // ==== AUTO-SAVE session user ====
      useEffect(() => {
        if (currentUser) {
          Storage.save(CONFIG.SESSION_KEY, currentUser);
        } else {
          Storage.remove(CONFIG.SESSION_KEY);
        }
      }, [currentUser]);

      // ==== DARK MODE ====
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // ==== LOGIN HANDLER ====
      const handleLogin = (username, password, portal) => {
        if (portal === 'student') {
          const found = students.find(s => s.username.toLowerCase() === username.toLowerCase() && s.passwordHash === password);
          if (found) {
            setCurrentUser(found);
            setActiveTab('dashboard');
            return true;
          }
        } else {
          const found = supervisors.find(s => s.username.toLowerCase() === username.toLowerCase() && s.passwordHash === password);
          if (found) {
            setCurrentUser(found);
            setActiveTab('dashboard');
            return true;
          }
        }
        return false;
      };

      const handleLogout = () => {
        setCurrentUser(null);
        Storage.remove(CONFIG.SESSION_KEY);
      };

      // ==== REPORT CRUD ====
      const handleCreateOrUpdateReport = (formData, uploadingPhotos) => {
        let repId = reportToEdit ? reportToEdit.id : 'rep-' + Date.now();

        if (reportToEdit) {
          setReports(prev => prev.map(r => r.id === repId ? { ...r, ...formData, status: 'Menunggu Review', note: '' } : r));
        } else {
          const newRep = {
            id: repId,
            student_id: currentUser.id,
            supervisor_id: currentUser.supervisor_id,
            ...formData,
            status: 'Menunggu Review',
            note: '',
            submitted_at: new Date().toISOString().replace('T', ' ').substring(0, 19),
            reviewed_at: null,
            deleted_at: null
          };
          setReports(prev => [newRep, ...prev]);
        }

        const newPhotoRecords = uploadingPhotos.map((p, idx) => ({
          photo_id: p.id.startsWith('temp-') ? 'pho-' + Date.now() + idx : p.id,
          report_id: repId,
          file_url: p.url,
          file_name: p.name,
          uploaded_at: new Date().toISOString().replace('T', ' ').substring(0, 19),
          deleted_at: null
        }));

        setPhotos(prev => [
          ...prev.filter(p => p.report_id !== repId),
          ...newPhotoRecords
        ]);

        setReportToEdit(null);
        setActiveTab('reports');
      };

      const handleConfirmDeleteReport = () => {
        if (!deleteTargetId) return;
        const now = new Date().toISOString();
        setReports(prev => prev.map(r => r.id === deleteTargetId ? { ...r, deleted_at: now } : r));
        setPhotos(prev => prev.map(p => p.report_id === deleteTargetId ? { ...p, deleted_at: now } : p));
        setDeleteTargetId(null);
      };

      const handleApproveReport = (id, note) => {
        const now = new Date().toISOString().replace('T', ' ').substring(0, 19);
        setReports(prev => prev.map(r => r.id === id ? { ...r, status: 'Disetujui', note, reviewed_at: now } : r));
        setSelectedReport(null);
      };

      const handleRejectReport = (id, note) => {
        const now = new Date().toISOString().replace('T', ' ').substring(0, 19);
        setReports(prev => prev.map(r => r.id === id ? { ...r, status: 'Ditolak', note, reviewed_at: now } : r));
        setSelectedReport(null);
      };

      // ==== PROFILE UPDATES ====
      const handleUpdateProfile = (updatedData) => {
        setCurrentUser(updatedData);
        if (currentUser.role === 'student') {
          setStudents(prev => prev.map(s => s.id === updatedData.id ? updatedData : s));
        } else {
          setSupervisors(prev => prev.map(s => s.id === updatedData.id ? updatedData : s));
        }
      };

      const handleUpdateAvatar = (avatarBase64) => {
        const updated = { ...currentUser, avatar: avatarBase64 };
        handleUpdateProfile(updated);
      };

      const handleDeleteAvatar = () => {
        const updated = { ...currentUser, avatar: null };
        handleUpdateProfile(updated);
      };

      // ==== BACKUP JSON ====
      const handleExportJSON = () => {
        const backupData = {
          metadata: {
            app: "PKL_REPORT_SYSTEM_2026",
            export_date: new Date().toISOString(),
            version: "2.1.0"
          },
          students: students.map(({ passwordHash, ...s }) => s),
          supervisors: supervisors.map(({ passwordHash, ...sp }) => sp),
          reports: reports.filter(r => !r.deleted_at),
          photos: photos.filter(p => !p.deleted_at)
        };

        const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(backupData, null, 2))}`;
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", jsonString);
        downloadAnchor.setAttribute("download", `backup-pkl-2026-${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportJSON = (data) => {
        if (data.students) setStudents(data.students);
        if (data.supervisors) setSupervisors(data.supervisors);
        if (data.reports) setReports(data.reports);
        if (data.photos) setPhotos(data.photos);
        alert('✅ Data berhasil di-restore!');
      };

      const handleResetData = () => {
        if (!confirm('⚠️ Yakin reset SEMUA data ke default?\n\nSemua laporan, foto, dan profil akan dihapus dari browser dan diganti dengan data demo.')) return;
        Storage.remove(CONFIG.STORAGE_KEY);
        Storage.remove(CONFIG.SESSION_KEY);
        setStudents(INITIAL_STUDENTS);
        setSupervisors(INITIAL_SUPERVISORS);
        setReports(INITIAL_REPORTS);
        setPhotos(INITIAL_PHOTOS);
        setCurrentUser(null);
        alert('✅ Data berhasil direset ke default.');
      };

      // ==== STORAGE INFO ====
      const storageInfo = useMemo(() => {
        try {
          const raw = localStorage.getItem(CONFIG.STORAGE_KEY) || '';
          const usedKB = Math.round(new Blob([raw]).size / 1024);
          return { usedKB };
        } catch {
          return { usedKB: 0 };
        }
      }, [reports, photos, students, supervisors]);

      // ==== EXPORT EXCEL ====
      const handleExportExcel = (specificReport = null) => {
        const targetReports = specificReport 
          ? [specificReport] 
          : reports.filter(r => !r.deleted_at && (currentUser.role === 'student' ? r.student_id === currentUser.id : r.supervisor_id === currentUser.id));

        const exportData = targetReports.map((r, idx) => ({
          'No': idx + 1,
          'ID Laporan': r.id,
          'Tanggal': r.date,
          'Siswa': currentUser.role === 'student' ? currentUser.name : (students.find(s => s.id === r.student_id)?.name || 'Siswa'),
          'Presensi': r.attendance,
          'Jam': `${r.checkIn} - ${r.checkOut}`,
          'Judul Pekerjaan': r.title,
          'Deskripsi Kegiatan': r.description,
          'Hasil Pekerjaan': r.result || '-',
          'Kendala': r.obstacles || '-',
          'Solusi': r.solution || '-',
          'Status Review': r.status,
          'Catatan Pembimbing': r.note || '-'
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan PKL");
        XLSX.writeFile(workbook, `laporan-pkl-${currentUser.name.toLowerCase().replace(/\s+/g, '-')}-${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      // ==== EXPORT PDF ====
      const handleExportPDF = (specificReport = null) => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const targetReports = specificReport 
          ? [specificReport] 
          : reports.filter(r => !r.deleted_at && (currentUser.role === 'student' ? r.student_id === currentUser.id : r.supervisor_id === currentUser.id));

        doc.setFontSize(16);
        doc.text("LAPORAN KEGIATAN HARIAN PKL 2026", 14, 15);
        
        doc.setFontSize(10);
        doc.text(`Nama: ${currentUser.name}`, 14, 23);
        doc.text(`Instansi/Sekolah: ${currentUser.role === 'student' ? currentUser.school : currentUser.institution}`, 14, 28);
        doc.text(`Tanggal Export: ${new Date().toLocaleDateString('id-ID')}`, 14, 33);

        const tableColumn = ["No", "Tanggal", "Judul Kegiatan", "Status", "Catatan Pembimbing"];
        const tableRows = targetReports.map((r, i) => [
          i + 1,
          r.date,
          r.title,
          r.status,
          r.note || '-'
        ]);

        doc.autoTable({
          head: [tableColumn],
          body: tableRows,
          startY: 38,
          theme: 'grid',
          headStyles: { fillColor: [79, 70, 229] }
        });

        doc.save(`laporan-pkl-${currentUser.name.toLowerCase().replace(/\s+/g, '-')}-${new Date().toISOString().split('T')[0]}.pdf`);
      };

      // ==== FILTERED REPORTS ====
      const userReports = useMemo(() => {
        if (!currentUser) return [];
        return reports.filter(r => 
          !r.deleted_at && 
          (currentUser.role === 'student' ? r.student_id === currentUser.id : r.supervisor_id === currentUser.id) &&
          (statusFilter === 'Semua' ? true : r.status === statusFilter)
        );
      }, [reports, currentUser, statusFilter]);

      // ==== UI INTERACTIVE STATES (declare setelah semua handler) ====
      const [selectedReport, setSelectedReport] = useState(null);
      const [reportToEdit, setReportToEdit] = useState(null);
      const [statusFilter, setStatusFilter] = useState('Semua');
      const [deleteTargetId, setDeleteTargetId] = useState(null);

      if (!currentUser) {
        return (
          <LoginView 
            portalType={portalRoute} 
            onLogin={handleLogin} 
            onSwitchPortal={() => setPortalRoute(r => r === 'student' ? 'supervisor' : 'student')} 
          />
        );
      }

      const assignedSupervisor = currentUser.role === 'student' 
        ? supervisors.find(s => s.id === currentUser.supervisor_id) 
        : null;

      return (
        <div className="flex h-full overflow-hidden bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
          
          {/* SIDEBAR NAVIGATION - DESKTOP */}
          <aside className="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 p-4 flex flex-col justify-between hidden md:flex shrink-0">
            <div className="space-y-6">
              <div className="flex items-center gap-3 px-2">
                <div className={`w-9 h-9 ${currentUser.role === 'student' ? 'bg-indigo-600' : 'bg-emerald-600'} rounded-xl flex items-center justify-center text-white font-black text-sm shadow-md`}>
                  PKL
                </div>
                <div>
                  <h1 className="font-extrabold text-sm leading-tight">PKL System 2026</h1>
                  <p className="text-[10px] text-slate-400 font-semibold uppercase">{currentUser.role === 'student' ? 'Portal Siswa' : 'Portal Pembimbing'}</p>
                </div>
              </div>

              <nav className="space-y-1 text-xs font-bold">
                <button 
                  onClick={() => setActiveTab('dashboard')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition ${activeTab === 'dashboard' ? 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                >
                  <Icon name="grid" size={16} /> Dashboard
                </button>

                <button 
                  onClick={() => setActiveTab('reports')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition ${activeTab === 'reports' ? 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                >
                  <Icon name="file-text" size={16} /> Laporan Harian
                </button>

                {currentUser.role === 'student' && (
                  <button 
                    onClick={() => { setReportToEdit(null); setActiveTab('add-report'); }} 
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition ${activeTab === 'add-report' ? 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                  >
                    <Icon name="plus-circle" size={16} /> Buat Laporan Baru
                  </button>
                )}

                <button 
                  onClick={() => setActiveTab('profile')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition ${activeTab === 'profile' ? 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                >
                  <Icon name="user" size={16} /> Edit Profil
                </button>

                <button 
                  onClick={() => setActiveTab('backup')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition ${activeTab === 'backup' ? 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                >
                  <Icon name="database" size={16} /> Backup & Restore
                </button>
              </nav>
            </div>

            <div className="pt-4 border-t dark:border-slate-700 space-y-3">
              <div className="flex items-center justify-between px-2">
                <span className="text-xs font-bold text-slate-500">Dark Mode</span>
                <button 
                  onClick={() => setDarkMode(!darkMode)} 
                  className={`w-10 h-6 rounded-full p-1 transition ${darkMode ? 'bg-indigo-600 justify-end' : 'bg-slate-300 justify-start'} flex items-center`}
                >
                  <span className="w-4 h-4 rounded-full bg-white shadow-md"></span>
                </button>
              </div>

              <div className="flex items-center gap-3 p-2 bg-slate-50 dark:bg-slate-700/40 rounded-2xl">
                <UserAvatar src={currentUser.avatar} name={currentUser.name} size="sm" />
                <div className="flex-1 min-w-0">
                  <p className="font-bold text-xs truncate">{currentUser.name}</p>
                  <p className="text-[10px] text-slate-400 truncate">{currentUser.email}</p>
                </div>
                <button onClick={handleLogout} className="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg">
                  <Icon name="log-out" size={16} />
                </button>
              </div>
            </div>
          </aside>

          {/* MAIN WRAPPER */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            {/* HEADER */}
            <header className="h-16 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 sm:px-6 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3">
                <button onClick={() => setMobileMenuOpen(true)} className="p-2 rounded-xl border dark:border-slate-700 md:hidden">
                  <Icon name="menu" size={18} />
                </button>
                <h2 className="font-extrabold text-sm sm:text-base capitalize">
                  {activeTab === 'dashboard' && 'Dashboard Utama'}
                  {activeTab === 'reports' && 'Kelola Laporan Harian'}
                  {activeTab === 'add-report' && 'Formulir Laporan Harian'}
                  {activeTab === 'profile' && 'Pengaturan Profil Akun'}
                  {activeTab === 'backup' && 'Backup & Export Data JSON'}
                </h2>
              </div>

              <div className="flex items-center gap-3">
                <UserAvatar src={currentUser.avatar} name={currentUser.name} size="sm" />
              </div>
            </header>

            {/* ROUTED CONTENT BODY */}
            <div className="flex-1 overflow-y-auto p-4 sm:p-6 scrollbar-none">
              {activeTab === 'dashboard' && (
                currentUser.role === 'student' ? (
                  <StudentDashboard 
                    user={currentUser} 
                    supervisor={assignedSupervisor} 
                    reports={reports} 
                    setActiveTab={setActiveTab} 
                  />
                ) : (
                  <SupervisorDashboard 
                    user={currentUser} 
                    students={students} 
                    reports={reports} 
                    setActiveTab={setActiveTab} 
                    onSelectReport={setSelectedReport} 
                  />
                )
              )}

              {activeTab === 'reports' && (
                <ReportsView 
                  reports={userReports} 
                  photos={photos} 
                  isStudent={currentUser.role === 'student'} 
                  onSelectReport={setSelectedReport} 
                  onEditReport={(r) => { setReportToEdit(r); setActiveTab('add-report'); }} 
                  onDeleteReport={(id) => setDeleteTargetId(id)} 
                  statusFilter={statusFilter} 
                  setStatusFilter={setStatusFilter} 
                  onExportExcel={() => handleExportExcel()}
                  onExportPDF={() => handleExportPDF()}
                />
              )}

              {activeTab === 'add-report' && currentUser.role === 'student' && (
                <AddReportView 
                  reportToEdit={reportToEdit} 
                  onSubmit={handleCreateOrUpdateReport} 
                  onCancel={() => { setReportToEdit(null); setActiveTab('reports'); }} 
                  photos={photos} 
                />
              )}

              {activeTab === 'profile' && (
                <ProfileView 
                  user={currentUser} 
                  isStudent={currentUser.role === 'student'} 
                  onUpdateProfile={handleUpdateProfile} 
                  onUpdateAvatar={handleUpdateAvatar} 
                  onDeleteAvatar={handleDeleteAvatar}
                />
              )}

              {activeTab === 'backup' && (
                <BackupRestoreView 
                  onExportJSON={handleExportJSON} 
                  onImportJSON={handleImportJSON} 
                  onResetData={handleResetData}
                  storageInfo={storageInfo}
                />
              )}
            </div>
          </main>

          {/* MOBILE NAVIGATION DRAWER */}
          {mobileMenuOpen && (
            <div className="fixed inset-0 z-50 flex md:hidden">
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setMobileMenuOpen(false)}></div>
              <div className="relative bg-white dark:bg-slate-800 w-4/5 max-w-xs h-full p-5 flex flex-col justify-between shadow-2xl space-y-6">
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <span className="font-black text-sm text-indigo-600">PKL System 2026</span>
                    <button onClick={() => setMobileMenuOpen(false)} className="p-1 text-slate-400">
                      <Icon name="x" size={20} />
                    </button>
                  </div>

                  <nav className="space-y-1 text-xs font-bold">
                    <button onClick={() => { setActiveTab('dashboard'); setMobileMenuOpen(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">
                      <Icon name="grid" size={16} /> Dashboard
                    </button>
                    <button onClick={() => { setActiveTab('reports'); setMobileMenuOpen(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">
                      <Icon name="file-text" size={16} /> Laporan Harian
                    </button>
                    {currentUser.role === 'student' && (
                      <button onClick={() => { setReportToEdit(null); setActiveTab('add-report'); setMobileMenuOpen(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">
                        <Icon name="plus-circle" size={16} /> Buat Laporan Baru
                      </button>
                    )}
                    <button onClick={() => { setActiveTab('profile'); setMobileMenuOpen(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">
                      <Icon name="user" size={16} /> Edit Profil
                    </button>
                    <button onClick={() => { setActiveTab('backup'); setMobileMenuOpen(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">
                      <Icon name="database" size={16} /> Backup & Restore
                    </button>
                  </nav>
                </div>

                <div className="pt-4 border-t dark:border-slate-700 space-y-3">
                  <button onClick={handleLogout} className="w-full py-2.5 bg-rose-50 text-rose-600 font-bold text-xs rounded-xl flex items-center justify-center gap-2">
                    <Icon name="log-out" size={16} /> Keluar Akun
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* REPORT DETAIL MODAL */}
          {selectedReport && (
            <ReportDetailModal 
              report={selectedReport} 
              photos={photos} 
              isStudent={currentUser.role === 'student'} 
              onClose={() => setSelectedReport(null)} 
              onApprove={handleApproveReport} 
              onReject={handleRejectReport} 
              onExportSingleExcel={(r) => handleExportExcel(r)}
              onExportSinglePDF={(r) => handleExportPDF(r)}
            />
          )}

          {/* CONFIRMATION DELETE MODAL */}
          <ConfirmModal 
            isOpen={!!deleteTargetId}
            title="Hapus Laporan Harian?"
            message="Apakah Anda yakin ingin menghapus laporan ini? Laporan yang dihapus tidak akan ditampilkan lagi pada sistem."
            onConfirm={handleConfirmDeleteReport}
            onCancel={() => setDeleteTargetId(null)}
          />

        </div>
      );
    };

    // RENDER APP ROOT
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
